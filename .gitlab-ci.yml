# The pipeline fleet workers wait on before auto-merge.
stages: [test]

test:
  stage: test
  # Playwright's image ships Node and Chromium, so the rendered card checks run instead of skipping.
  image: mcr.microsoft.com/playwright:v1.64.1-noble
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  script:
    - npm ci --cache .npm --prefer-offline
    - node --test game/web/spec.js
    - npm test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
