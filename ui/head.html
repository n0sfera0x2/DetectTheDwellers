<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Detect the Dwellers · Binary Defense</title>
<style>
/*__FONTS__*/
:root{--bg:#07060A;--ink:#F3E9E2;--mut:#B9A99E;--fl:#FF5A2A;--am:#FF9B54;--cy:#38E1FF;
--s1:#110E13;--s2:#19151C;--s3:#2A2329;--rule:rgba(243,233,226,.12);--rule2:rgba(243,233,226,.24);--line:rgba(255,155,84,.42);--cl:rgba(56,225,255,.5);--off:#9A8F89;
/* Paper: the game cards, matched to the print fronts (deck/cards.js). Every text colour here is at least 4.5:1 on --pp. */
--pp:#F6F2EC;--pk:#1A1418;--pm:#5A4B43;--pr:#D8CEC3;--flt:#A8360F;--cyt:#005F73;--amt:#8A4510;--ftint:#FCE6DC;
--disp:"Chakra Petch",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
--ch:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px));
--chp:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px));
--hex:polygon(50% 0,100% 24%,100% 76%,50% 100%,0 76%,0 24%);
--ease:cubic-bezier(.16,1,.3,1);color-scheme:dark;box-sizing:border-box;
/* Cards everywhere: one portrait poker card (5:7), at most 420 px wide, smaller when the screen is short. */
--cw:min(420px,max(300px,calc((100svh - 300px) * 5 / 7)))}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07060A}}:root[data-theme="dark"],:root[data-theme="light"]{--bg:#07060A}
html{scroll-padding-top:92px;scroll-padding-bottom:120px;scrollbar-color:var(--s3) var(--bg);-webkit-text-size-adjust:100%}*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font:500 17px/1.45 var(--disp);letter-spacing:.005em;-webkit-font-smoothing:antialiased;
  background:radial-gradient(70% 50% at 85% -10%,rgba(56,225,255,.07),transparent 70%),radial-gradient(50% 40% at 0% 110%,rgba(255,155,84,.06),transparent 70%),var(--bg);background-attachment:fixed;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
::selection{background:var(--cy);color:#04141a}
button,input{font:inherit;color:inherit;border-radius:0}input{caret-color:var(--cy)}
:focus-visible{outline:2px solid var(--cy);outline-offset:3px}
h1,h2,h3,h4,p,dl,dd,ul,ol{margin:0;padding:0}ul,ol{list-style:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1400px;margin:0 auto;padding:20px clamp(16px,3vw,32px) 32px}.wrap.game{padding-bottom:12px}
.ic{width:16px;height:16px;flex:none;vertical-align:-3px}

/* Type roles. Chakra Petch carries words; IBM Plex Mono only numbers, dice, stats, the log and kbd (400/600 only). */
.meta{font-family:var(--disp);font-weight:500;font-size:14px;line-height:1.35;letter-spacing:.01em;color:var(--mut)}.meta.c{color:var(--cy)}.meta.f{color:var(--fl)}.meta.a{color:var(--am)}
.logo{font-family:var(--disp);font-weight:700;text-transform:uppercase;letter-spacing:-.01em;line-height:.92;font-size:clamp(44px,6.2vw,88px);color:var(--ink);text-wrap:balance}
.nm{font-family:var(--disp);font-weight:700;text-transform:uppercase;letter-spacing:.02em;line-height:1.08;text-wrap:balance}
.num{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:0}
.lede{font-size:clamp(17px,1.5vw,20px);line-height:1.5;max-width:56ch;color:var(--ink)}
.body-s{font-size:15px;line-height:1.4;color:var(--mut);max-width:70ch}
kbd{font-family:var(--mono);font-weight:600;font-size:11px;line-height:1;padding:3px 5px;border:1px solid currentColor;opacity:.75;letter-spacing:0}
@media (hover:none){kbd,.keys{display:none!important}}

/* Surfaces */
.panel{position:relative;border:1px solid var(--rule);background:var(--s1)}
.panel.c{border-color:var(--cl)}.pad{padding:16px 18px}
.art{display:block;width:100%;aspect-ratio:200/112;overflow:hidden;background:#07060A}.art svg{display:block;width:100%;height:100%}

/* Buttons: the chamfer lives on pseudo-elements so the button itself stays unclipped and its focus ring shows */
.btn{--bd:var(--line);--fill:var(--s1);--tx:var(--ink);position:relative;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:9px 16px;border:0;background:none;color:var(--tx);cursor:pointer;
  font-family:var(--disp);font-weight:700;font-size:15px;line-height:1.15;letter-spacing:.06em;text-transform:uppercase;text-align:center;transition:transform .12s var(--ease)}
.btn::before,.btn::after{content:"";position:absolute;z-index:-1;clip-path:var(--ch);transition:background-color .15s}
.btn::before{inset:0;background:var(--bd)}.btn::after{inset:1px;background:var(--fill)}
.btn:hover:not(:disabled){--fill:var(--s3)}.btn:active:not(:disabled){transform:translateY(1px)}
/* Disabled text stays readable (#9A8F89 on the panel is 5.9:1); the border and the cursor carry "off". */
.btn:disabled{cursor:not-allowed;--tx:var(--off);--bd:rgba(243,233,226,.16)}
.btn.p{--bd:var(--cy);--fill:var(--cy);--tx:#04141a}.btn.p:hover:not(:disabled){--fill:#8DEEFF;--bd:#8DEEFF}
.btn.p:disabled{--fill:var(--s2);--bd:rgba(56,225,255,.3);--tx:var(--off)}
.btn.cy{--bd:var(--cl);--tx:var(--cy)}.btn.cy:hover:not(:disabled){--fill:rgba(56,225,255,.12)}
.btn.warn{--bd:var(--fl);--fill:var(--fl);--tx:#160904}.btn.warn:hover:not(:disabled){--fill:#FF7A52;--bd:#FF7A52}
.btn.s{min-height:36px;padding:6px 12px;font-size:13px}.btn.tb{min-height:44px}
@media (max-width:640px){.btn.s{min-height:44px}}.btn.w{width:100%}.btn.big{min-height:56px;font-size:17px}
.btn kbd{border-color:currentColor}
.lnk{background:none;border:0;padding:8px 0;min-height:44px;color:var(--cy);font-family:var(--disp);font-weight:500;font-size:16px;letter-spacing:0;cursor:pointer;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px;text-align:left}
.lnk:hover{text-decoration-thickness:2px}.meta .lnk{font-size:inherit;font-family:var(--disp);min-height:0;padding:0 2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.badge{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--cy);color:var(--cy);font-family:var(--disp);font-weight:700;font-size:12px;letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;line-height:1.25;white-space:nowrap}
.badge.on{background:var(--cy);color:#04141a}
.sech{font-family:var(--disp);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--cy);display:flex;gap:8px;align-items:center}
.sech::before{content:"";width:6px;height:6px;background:currentColor;flex:none}
.sech.f{color:var(--fl)}.sech.a{color:var(--am)}

/* Paper cards: light ground, a cut-corner frame line in the card's colour, a solid tab top left, the art set in as a dark screen. */
.paper{--pl:var(--flt);--pa:var(--fl);position:relative;isolation:isolate;color:var(--pk);background:var(--pp);clip-path:var(--chp)}
.paper::before,.paper::after{content:"";position:absolute;z-index:-1;pointer-events:none}
.paper::before{inset:5px;background:var(--pl);clip-path:polygon(0 0,calc(100% - 13px) 0,100% 13px,100% 100%,13px 100%,0 calc(100% - 13px))}
.paper::after{inset:6px;background:var(--pp);clip-path:polygon(0 0,calc(100% - 12.6px) 0,100% 12.6px,100% 100%,12.6px 100%,0 calc(100% - 12.6px))}
.paper>.tab{position:absolute;left:5px;top:5px;width:34px;height:4px;background:var(--pa);z-index:1}
.paper.cy{--pl:var(--cyt);--pa:var(--cy)}.paper.am{--pl:var(--amt);--pa:var(--am)}
.scr{position:relative;display:block;overflow:hidden;background:#07060A;border:3px solid #07060A;outline:1px solid var(--pr)}
.scr svg{position:absolute;inset:0;display:block;width:100%;height:100%}
.ptag{align-self:flex-start;font-family:var(--disp);font-weight:700;font-size:12px;line-height:1.35;letter-spacing:.06em;text-transform:uppercase;color:var(--pk);background:var(--fl);padding:0 6px;white-space:nowrap}
.ptag.cy{background:var(--cy)}
.phud{font-family:var(--disp);font-weight:700;font-size:12px;line-height:1.35;letter-spacing:.06em;text-transform:uppercase;color:var(--pm)}
.phud.c{color:var(--cyt)}.phud.f{color:var(--flt)}.phud.a{color:var(--amt)}
.rng{font-family:var(--mono);font-weight:600;font-size:12px;line-height:1.35;letter-spacing:.02em;text-transform:uppercase;color:var(--amt);white-space:nowrap}
.paper .nm{color:var(--pk)}
.mh{display:flex;justify-content:space-between;gap:6px 10px;flex-wrap:wrap;align-items:baseline}
.paper :focus-visible{outline-color:var(--cyt)}
.paper .stat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.paper .stat div{background:#fff;border:1px solid var(--pr);padding:3px 7px 4px;min-width:0}
.paper .stat dt{font-family:var(--mono);font-weight:600;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--pm)}
.paper .stat dd{font-family:var(--mono);font-weight:600;font-size:24px;line-height:1.15;color:var(--pk);font-variant-numeric:tabular-nums}
.paper .stat .def dd{color:var(--flt)}
.stat .why{display:block;font-family:var(--mono);font-weight:600;font-size:11px;line-height:1.25;color:var(--flt);letter-spacing:0}
.paper .stat dd .why{font-size:11px}
.pips{display:flex;gap:4px;flex-wrap:wrap;padding-left:2px}.pips i{width:14px;height:9px;background:var(--flt);border:1px solid var(--flt);transform:skewX(-14deg)}.pips i.gone{background:transparent;border-color:var(--pm)}
.ability{padding:5px 9px;background:var(--ftint);border:1px solid var(--fl);font-size:15px;line-height:1.4;color:var(--pk)}.ability b{font-weight:700;text-transform:uppercase;font-size:14px;letter-spacing:.03em;color:var(--flt)}
.kwi{vertical-align:-3px;margin-right:6px;color:var(--flt)}
/* Flavor text: no italic face is embedded, so flavor is set upright, smaller and quieter, under a short rule. */
.fl{font-size:14px;line-height:1.4;color:var(--mut);max-width:70ch}
.paper .fl{color:var(--pm);border-top:1px solid var(--pr);padding-top:6px}

/* Intro */
.intro-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(20px,3vw,44px);align-items:start}
.hero{display:flex;flex-direction:column;gap:14px}.hero .art{border:1px solid var(--rule)}.hero .logo{margin-top:4px}
.setup{display:flex;flex-direction:column;gap:12px;padding:18px 20px 0}
.setup h2{margin-top:6px}
.seg{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:6px}
.opt{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-height:56px;padding:9px 12px;border:1px solid var(--rule2);background:var(--s2);text-align:left;cursor:pointer}
.opt b{font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:.03em;line-height:1.1}
.opt:hover{border-color:var(--cy)}
.opt[aria-pressed="true"]{border-color:var(--cy);box-shadow:inset 0 0 0 1px var(--cy);background:#0E1A1F}.opt[aria-pressed="true"] .meta{color:var(--cy)}
.opt[aria-pressed="true"]::after{content:"";position:absolute;top:8px;right:8px;width:8px;height:8px;background:var(--cy)}
.picks{display:grid;gap:6px}
.pick{display:grid;grid-template-columns:132px minmax(0,1fr) auto;align-items:center;gap:14px;width:100%;padding:0 12px 0 0;border:1px solid var(--rule2);background:var(--s2);text-align:left;cursor:pointer;min-height:88px}
.pick .art{height:100%;aspect-ratio:3/2;min-height:88px}.pick .nm{font-size:17px}.pick .perk{font-size:15px;line-height:1.35;color:var(--mut)}
.pick .st{font-family:var(--disp);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);display:inline-flex;gap:4px;align-items:center}
.pick:hover:not(:disabled){border-color:var(--cy)}
.pick[aria-pressed="true"]{border-color:var(--cy);box-shadow:inset 0 0 0 1px var(--cy);background:#0E1A1F}.pick[aria-pressed="true"] .st{color:var(--cy)}
.pick:disabled{opacity:.4;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:6px}.field input{min-height:46px;padding:10px 12px;border:1px solid var(--rule2);background:var(--bg);font-size:17px}
.field input:focus-visible{outline-offset:0;border-color:var(--cy)}
.startbar{position:sticky;bottom:0;z-index:5;margin:4px -20px 0;padding:12px 20px calc(14px + env(safe-area-inset-bottom,0px));background:var(--s1);border-top:1px solid var(--rule);display:flex;flex-direction:column;gap:8px}
.lbmini{border-top:1px solid var(--rule);padding-top:12px}
@media (max-width:900px){.intro-grid{grid-template-columns:1fr}.hero .art{aspect-ratio:200/72}.hero{gap:10px}.startbar{box-shadow:0 -10px 24px rgba(0,0,0,.55);padding-top:10px;gap:6px}.setup{scroll-padding-bottom:120px}.setup .sech{scroll-margin-bottom:130px}
  .pick{grid-template-columns:104px minmax(0,1fr) auto;gap:12px;min-height:72px}.pick .art{min-height:72px}}

/* Game shell. Desktop: one sticky top bar (brand, feed, crew HP, log, quit), then the desk: one wide column. */
.gtop{position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;align-items:center;gap:8px 22px;margin:-20px calc(-1 * clamp(16px,3vw,32px)) 0;padding:10px clamp(16px,3vw,32px);background:rgba(7,6,10,.96);border-bottom:1px solid var(--rule)}
.top{display:flex;align-items:center;gap:10px 18px;flex:1 1 440px;min-width:0}
.brand{font-family:var(--disp);font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap}
.feed{display:flex;flex-direction:column;gap:5px;flex:1 1 180px;min-width:0;max-width:300px}.feedbar{display:flex;gap:3px}.feedbar i{flex:1;height:7px;background:var(--s3)}.feedbar i.done{background:var(--am)}.feedbar i.now{background:var(--ink)}.feedbar i.boss{flex:1.8;background:transparent;border:1px solid var(--fl)}.feedbar i.boss.now{background:var(--fl)}.feedbar i.next{background:transparent;box-shadow:inset 0 0 0 1px var(--ink)}.feedbar i.boss.next{box-shadow:inset 0 0 0 1px var(--fl)}
.feed .meta{font-size:13px;white-space:nowrap}
.tbtns{display:flex;gap:8px;align-items:center;margin-left:auto}
.quitask{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.main{display:flex;flex-direction:column;gap:12px;min-width:0;margin-top:14px}

/* Crew HP: compact readouts. In the top bar on desktop, a sticky strip on phones. */
.crew{display:flex;gap:6px;flex:0 1 auto;min-width:0}
.pc{display:flex;flex-direction:column;gap:4px;min-width:150px;max-width:220px;padding:6px 10px 7px;border:1px solid var(--rule);background:var(--s1)}
.pc.on{border-color:var(--cl);background:#0E171B}
.pc-h{display:flex;align-items:baseline;gap:8px;min-width:0}
.pc .nm{font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pc .short{display:none}
.pc .dot{width:7px;height:7px;background:var(--cy);flex:none;align-self:center}
.hpn{display:flex;align-items:baseline;gap:2px;white-space:nowrap}.hpn b{font-size:20px;line-height:1}.hpn .of{font-family:var(--mono);font-weight:400;font-size:12px;color:var(--mut)}
.hpbar{position:relative;height:7px;background:var(--s3);overflow:hidden}.hpbar i{position:absolute;left:0;top:0;bottom:0;background:var(--cy)}.hpbar.low i{background:var(--am)}
.hpbar i.inci{background:var(--fl);border-left:2px solid var(--bg)}
.flash .hpbar{animation:hit .7s steps(1) 1}.flash .hpn b{animation:hitn .7s steps(1) 1}
@keyframes hit{0%,30%,60%{filter:none}15%,45%{filter:brightness(0) invert(1)}}@keyframes hitn{0%,30%,60%{color:var(--ink)}15%,45%{color:var(--fl)}}
.inc{font-family:var(--disp);font-weight:500;font-size:13px;line-height:1.3;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.inc b{color:var(--fl);font-weight:700}.inc.safe b{color:var(--cy)}
.inc .num{font-weight:600}

/* Prompts, tips */
.prompt{padding:14px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.prompt p{font-size:17px;max-width:70ch}
/* Every tip and status line holds a readable measure: 70 characters at most. */
.tip{border:1px solid var(--cl);background:#0C171B;padding:6px 14px;min-height:48px;display:flex;gap:8px 14px;align-items:center;flex-wrap:wrap}.tip p{flex:0 1 70ch;font-size:16px;line-height:1.45;max-width:70ch}
.status{font-size:17px;line-height:1.45;color:var(--ink);max-width:70ch}.status b{color:var(--cy);font-weight:700}
.tip.urge{border-color:var(--cy);background:#0E2129}
.d20{width:60px;height:60px;flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:600;font-size:25px;color:#1a0d03;background:var(--am);clip-path:var(--hex);font-variant-numeric:tabular-nums}
.d20.q{background:var(--ink);color:#07060A}
.d20.tumble{animation:tumble .5s cubic-bezier(.2,.8,.25,1)}.d20.landed{animation:land .32s var(--ease)}
@keyframes tumble{from{transform:rotate(-320deg) scale(.55)}to{transform:none}}@keyframes land{0%{transform:scale(1.2)}100%{transform:none}}
.pbanner{display:flex;gap:12px;align-items:center;padding:10px 14px;border:1px solid var(--rule2);background:var(--s1)}.pbanner p{font-size:16px;line-height:1.45;max-width:70ch}.pbanner p b{font-weight:700}
.pbanner .d20{width:48px;height:48px;font-size:21px}
.table>.pbanner{margin:10px 14px 0;padding:6px 12px}.table>.pbanner .d20{width:40px;height:40px;font-size:18px}.table>.pbanner p{font-size:15px}.pbanner.hot{border-color:var(--am);background:#1A120C}.pbanner.hot p b{color:var(--am)}

/* The desk: one portrait card (situation, kit drop) with its actions beside it; the night desk shows around them. */
.desk{display:grid;grid-template-columns:var(--cw) minmax(0,520px);gap:18px 32px;align-items:start;justify-content:center}
.deskc{min-width:0}.desks{display:flex;flex-direction:column;gap:14px;min-width:0}
.desks .dock{position:static;box-shadow:none}.desks .dock .acts{flex-direction:column;align-items:stretch}.desks .dock .acts .btn{width:100%;flex:none}
.pcard{width:100%;aspect-ratio:5/7;display:flex;flex-direction:column;gap:9px;padding:16px 16px 18px;min-width:0}
.pcard .scr{aspect-ratio:auto;flex:1 1 calc(var(--cw) * .5);min-height:calc(var(--cw) * .5);max-height:calc(var(--cw) * .82)}
.pcard>.nm{font-size:26px}.pcard .txt{font-size:16px;line-height:1.45;color:var(--pm)}
.lootc>.nm{color:var(--cyt)}
.rulebox{background:#fff;border:1px solid var(--cyt);padding:9px 12px;font-size:18px;font-weight:700;line-height:1.35;color:var(--pk);margin-top:auto}
.part{border-top:1px solid var(--pr);padding-top:6px;font-size:16px;line-height:1.4;color:var(--pk)}.part .phud{display:block}
.flipin{animation:flipin .5s var(--ease) both}
@keyframes flipin{from{transform:perspective(1100px) rotateY(-78deg);opacity:.3}to{transform:none;opacity:1}}
@media (max-width:760px){
  .desk{grid-template-columns:minmax(0,1fr);gap:12px}.deskc{width:min(100%,420px);justify-self:center}
  /* The side column dissolves so the dock can stick to the bottom of the screen; the status line leads. */
  .desks{display:contents}.desk .status,.desk .pbanner{order:-1}
  .desks .dock{position:sticky;box-shadow:0 -12px 24px rgba(0,0,0,.45)}
  .pcard{aspect-ratio:auto;padding:12px 14px 14px}.pcard .scr{aspect-ratio:200/96;flex:none;min-height:0;max-height:none}.pcard>.nm{font-size:23px}
  .desks .dock .acts{flex-direction:row;flex-wrap:wrap}.desks .dock .acts .btn{width:auto;flex:1 1 140px}
}

/* Between fights: the feed face down (the print card back), the analysts as cards, the row as small amber cards. */
.pdesk{display:grid;grid-template-columns:clamp(200px,19vw,264px) minmax(0,1fr);gap:20px 40px;align-items:start}
.pd-feed{display:flex;flex-direction:column;gap:10px;padding:0 14px 14px 0}
.pd-side{display:flex;flex-direction:column;gap:24px;min-width:0}
.pd-point,.pd-row{display:flex;flex-direction:column;gap:10px}
.fdown{position:relative;isolation:isolate;display:block;width:100%;aspect-ratio:5/7;padding:0;border:1px solid var(--rule2);background:#07060A;color:var(--ink);cursor:pointer;text-align:center;
  transition:transform .2s var(--ease),border-color .2s;box-shadow:0 14px 28px rgba(0,0,0,.5)}
.fdown .fd-art{position:absolute;inset:0;overflow:hidden}.fdown .fd-art svg{display:block;width:100%;height:100%}
/* The cards still in the feed sit under the top one. */

table.lb{width:100%;border-collapse:collapse;font-size:15px;margin-top:8px}.lb th{text-align:left;font-family:var(--disp);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--cy);padding:7px 5px;border-bottom:1px solid var(--rule2)}.lb td{padding:8px 5px;border-bottom:1px solid var(--rule)}.lb td.n{text-align:right;font-family:var(--mono);font-weight:400;font-variant-numeric:tabular-nums}.lb tr.me td{color:var(--am)}

/* Narrow screens: no top-bar crew. The crew becomes a sticky strip at the top, so HP stays in view after a comeback;
   the dock is capped (about a third of the screen), dice run in one scrolling row, and a picked die's targets are
   buttons right in the dock, so a hit never needs a scroll. The mob card's own Hit button steps aside. */
@media (max-width:1040px){
  .gtop{display:contents}
  .top{flex-wrap:wrap;padding-bottom:10px;border-bottom:1px solid var(--rule)}
  .crew{position:sticky;top:0;z-index:30;display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));margin:0 calc(-1 * clamp(16px,3vw,32px));padding:6px clamp(16px,3vw,32px);background:rgba(7,6,10,.97);border-bottom:1px solid var(--rule)}
  .pc{min-width:0;max-width:none;padding:5px 8px 6px}
  .main{margin-top:12px}
  .mobonly{display:block}
  .hitb{display:none}
  .dock{max-height:35vh;max-height:35svh;overflow-y:auto;overscroll-behavior:contain;gap:8px;padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
  .dgroups{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:8px 14px 8px}.dgroups::-webkit-scrollbar{display:none}
  .dgroup{flex:none}.dice{flex-wrap:nowrap}
  /* A picked die's targets stack, one full-width button each: no sideways scroll, nothing clipped. */
  .tgts{display:flex;flex-direction:column;align-items:stretch;gap:6px}.tgts .btn{width:100%;min-height:44px;white-space:normal}
  .dock .acts{flex-wrap:nowrap}.dock .acts .grow{flex:1 1 auto}.dock .btn.big{min-height:48px;font-size:15px;padding:8px 12px}
  .dock .inc{font-size:13px;white-space:normal}
}
@media (max-width:640px){
  .wrap{padding-top:14px}
  .pointp .seg{grid-template-columns:repeat(min(var(--n,3),2),minmax(0,1fr))}.top{gap:8px 12px}.brand{font-size:16px;flex:1}.feed{order:3;flex-basis:100%;max-width:none}
  .table{margin:0 -16px;border-left:0;border-right:0}
  .fhead .kit{flex-basis:100%;align-items:stretch}.fhead .kitbar{justify-content:flex-start;gap:6px}.kname .kart{display:none}.kname{padding-left:10px}.fhead .kit .sech{white-space:nowrap}
  /* Kit chips wrap into a grid; Burn sits under the name, full width, so nothing is cut off. */
  .kchips{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;flex:1 1 100%;width:100%}
  .kchip{flex-direction:column;align-items:stretch;gap:0;padding:0 0 6px}.kchip .kname{width:100%}.kchip .btn{margin:0 6px;min-height:44px}
  .die{width:56px;height:64px}.die b{font-size:21px}.dock{padding-left:14px;padding-right:14px}.dgroups{gap:8px 14px}
  .pc .nm{font-size:13px}.hpn b{font-size:17px}.inc{font-size:12px}
  /* Three analysts on a phone: short names, and the max HP lives in the bar, so nothing needs an ellipsis. */
  .crew.tight .pc .full{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}.crew.tight .pc .short{display:inline}.crew.tight .hpn .of{display:none}
  /* Row chips scroll sideways; a fade on the right edge says there is more. */
  .rowstrip.infight .prow{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;max-width:100%;padding-right:28px;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 32px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 32px),transparent)}
  .rowstrip.infight .prow::-webkit-scrollbar{display:none}
  .rowstrip.infight .chip{flex:none}
}

@media (prefers-reduced-motion:reduce){
  .fresh{animation:fade .2s linear}.mob.ko{animation:none;opacity:.5}.burst{animation:none;opacity:0}.rv{animation:fade .25s linear}.stamp{animation:fade .25s linear both}
  .flash .hpbar{animation:none;outline:2px solid var(--fl);outline-offset:2px}.flash .hpn b{animation:none;color:var(--fl)}.btn{transition:none}
  .mob.fresh .bstamp{animation:fade .25s linear both}.d20.tumble,.d20.landed{animation:none}.kchip.urge{animation:none;box-shadow:inset 0 0 0 1px var(--cy)}
  .btn::before,.btn::after,.kname .chev,.fdown,.fdown::before,.fdown::after,.acard{transition:none}.fdown:hover,.acard:hover{transform:none}.flipin{animation:fade .2s linear}
}
@keyframes fade{from{opacity:0}to{opacity:1}}
</style>
