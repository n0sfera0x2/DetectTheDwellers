.card{border:1px dashed #999;background:#F6F2EC;padding:12px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.tag{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:#5A4B43}
.nm{font-weight:700;font-size:17px;line-height:1.1;text-transform:uppercase}.dmg{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;color:#5A4B43}.dmg b{font-size:20px;color:#1A1418}
.kw{font-size:12px;line-height:1.35;background:#FCE6DC;border:1px solid #FF5A2A;padding:5px 7px}.fl{font-size:10.5px;line-height:1.35;color:#5A4B43;border-top:1px solid #D8CEC3;padding-top:5px}
.dice{margin:auto -12px -12px;padding:7px 10px 9px;background:#fff;border-top:2px solid #1A1418;display:flex;flex-direction:column;align-items:center;gap:5px}
.dice .set{display:flex;flex-wrap:wrap;justify-content:center;gap:4px}.boss .dice .set{max-width:180px}
.dice .plus{display:flex;align-items:center;gap:4px;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:#5A4B43}.dice .plus b{font-size:14px;color:#1A1418}
.dbls{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.dface{background:#fff;border:1px solid #D8CEC3;height:42px;display:flex;align-items:center;justify-content:center}
.ex{display:flex;align-items:center;gap:5px;font-size:11px;color:#5A4B43;background:#fff;border:1px solid #D8CEC3;padding:5px 7px}
.note{font-size:11px;line-height:1.35;color:#5A4B43}.note svg{vertical-align:-2px}.note b{color:#1A1418}
.mode{font-size:12px;line-height:1.35}.mode b{display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;color:#005F73}.small{font-size:11px;font-weight:700}
/* Chapter dice web prototype: the dark table. Tokens follow ui/head.html (Ink & Static). Card faces use the shared
   paper card CSS (../cards.js CARD_CSS); this file only places them and adds live state around them. */
:root{--bg:#07060A;--ink:#F3E9E2;--mut:#B9A99E;--fl:#FF5A2A;--am:#FF9B54;--cy:#38E1FF;--s1:#110E13;--s2:#19151C;--s3:#2A2329;
--rule:rgba(243,233,226,.12);--rule2:rgba(243,233,226,.24);--line:rgba(255,155,84,.42);--off:#9A8F89;
--disp:"Chakra Petch",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
--ch:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px));
--hex:polygon(50% 0,100% 24%,100% 76%,50% 100%,0 76%,0 24%);--ease:cubic-bezier(.16,1,.3,1);color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--disp);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  background-image:radial-gradient(ellipse at 50% -10%,rgba(255,155,84,.08),transparent 55%),repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px)}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---- Buttons ---- */
.t-btn{border:1px solid var(--rule2);background:var(--s2);padding:9px 14px;min-height:40px;clip-path:var(--ch);font-weight:600;letter-spacing:.02em;
  transition:background .15s var(--ease),border-color .15s var(--ease),transform .1s var(--ease)}
.t-btn:hover:not(:disabled){background:var(--s3);border-color:var(--line)}
.t-btn:active:not(:disabled){transform:scale(.97)}
.t-btn.pri{background:var(--am);color:#1A1012;border-color:var(--am)}
.t-btn.pri:hover:not(:disabled){background:#FFB07A}
.t-btn.warn{border-color:rgba(255,90,42,.6);color:#FFB49C}
.t-btn.sm{padding:5px 10px;min-height:32px;font-size:13px}
.t-lnk{background:none;border:0;padding:6px 8px;color:var(--mut);font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.06em;min-height:36px}
.t-lnk:hover{color:var(--ink)}
.t-lnk[aria-pressed="true"]{color:var(--am)}

/* ---- Header ---- */
.t-top{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--rule)}
.t-brand{font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:15px;line-height:1.1}
.t-brand small{display:block;font-family:var(--mono);font-weight:500;font-size:10.5px;color:var(--am);letter-spacing:.08em}
.t-meta{font-family:var(--mono);font-size:12px;color:var(--mut);margin-left:auto;text-align:right}
.t-meta b{color:var(--ink);font-weight:600}
.t-nav{display:flex;gap:2px}

/* ---- Crew strip (sticky) ---- */
.t-crew{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px;padding:8px 16px;background:rgba(7,6,10,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--rule)}
.t-who{background:var(--s1);border:1px solid var(--rule);padding:7px 10px;clip-path:var(--ch);display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:baseline;min-width:0}
.t-who.pt{border-color:var(--line);box-shadow:inset 3px 0 0 var(--am)}
.t-who .n{font-weight:700;text-transform:uppercase;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-who .hp{font-family:var(--mono);font-size:13px;text-align:right}
.t-who .hp b{font-size:18px}
.t-who .bar{grid-column:1/-1;height:4px;background:var(--s3);position:relative;overflow:hidden}
.t-who .bar i{position:absolute;inset:0;background:var(--am);transform-origin:left;transition:transform .4s var(--ease)}
.t-who .bar i.lo{background:var(--fl)}
.t-who .bar s{position:absolute;inset:0;background:var(--fl);text-decoration:none;opacity:.75;transform-origin:left;transition:transform .2s var(--ease)}
.t-who .st{grid-column:1/-1;font-family:var(--mono);font-size:11.5px;color:var(--mut);display:flex;gap:8px;flex-wrap:wrap;min-height:16px}
.t-who .st .pt{color:var(--am)}.t-who .st .in{color:#FF9478}.t-who .st .bl{color:var(--cy)}.t-who .st .ok{color:var(--off)}

/* ---- Layout ---- */
.t-main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;padding:14px 16px 220px;max-width:1440px;margin:0 auto}
.t-table{min-width:0}
.t-side{display:flex;flex-direction:column;gap:14px;min-width:0}
.t-h{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:0 0 6px;display:flex;justify-content:space-between;gap:8px}
.t-panel{background:var(--s1);border:1px solid var(--rule);padding:10px;clip-path:var(--ch)}

/* ---- Row roll (the amber pair, 2d6) ---- */
.t-rowroll{display:flex;gap:12px;align-items:center;padding:8px 12px;margin:0 0 12px;border:1px solid var(--line);background:linear-gradient(90deg,rgba(255,155,84,.14),rgba(255,155,84,.03));clip-path:var(--ch)}
.t-rowroll.new{animation:pop .5s var(--ease)}
.t-rowroll.quiet{border-color:var(--rule);background:var(--s1);color:var(--mut)}
.t-pair{flex:0 0 auto;display:flex;align-items:center;gap:6px}
.t-pair b{font-family:var(--mono);font-size:20px;color:var(--am);margin-left:2px;min-width:3ch}
.t-amb{display:block;width:34px;height:34px;line-height:0}
.t-amb .pip rect{fill:var(--am);stroke:#1A1012}.t-amb .pip circle{fill:#1A1012}
.t-amb.blank{border-radius:7px;background:var(--s3)}
.t-rowroll p{margin:0;font-size:14px;line-height:1.35}
.t-rowroll p small{display:block;font-family:var(--mono);font-size:11px;color:var(--am);text-transform:uppercase;letter-spacing:.06em}
.t-rowroll .hit{color:#FF9478}
@keyframes pop{0%{transform:scale(.96);opacity:0}100%{transform:none;opacity:1}}

/* ---- Mobs on the table ---- */
.t-mobs{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
.t-slot{position:relative;display:flex;flex-direction:column;gap:6px;--z:1}
/* Paper cards inherit dark ink from the printed page's body; give them the same ink on the dark table. */
.card{color:#1A1418}
.t-slot .card{width:240px;height:336px;zoom:var(--z);border:0;border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.55),0 0 0 1px rgba(0,0,0,.4);transition:box-shadow .2s var(--ease),filter .3s}
.t-slot.down .card{filter:grayscale(.85) brightness(.7)}
.t-slot.enter{animation:deal .45s var(--ease)}
@keyframes deal{0%{transform:translateY(-14px) rotate(-1.5deg);opacity:0}100%{transform:none;opacity:1}}
.t-stamp{position:absolute;top:calc(214px * var(--z));right:-4px;transform:rotate(8deg);font-family:var(--mono);font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border:2px solid var(--fl);color:var(--fl);background:rgba(7,6,10,.88);pointer-events:none;z-index:2}
.t-stamp.beat{border-color:var(--cy);color:var(--cy);top:calc(160px * var(--z));right:auto;left:50%;transform:translateX(-50%) rotate(-6deg);font-size:15px}
.t-under{font-family:var(--mono);font-size:12px;color:var(--mut);width:calc(240px * var(--z));display:flex;flex-direction:column;gap:5px}
.t-under b{color:var(--ink)}
.t-under .hot{color:#FF9478}
/* The threat dice set under a card: live state, not part of the card face. Taken dice turn aside. */
.t-threat{width:calc(240px * var(--z));display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:-2px;padding:8px 6px 2px}
.t-td{position:relative;padding:0;border:0;background:none;width:34px;height:34px;line-height:0;border-radius:7px;transition:transform .18s var(--ease),opacity .18s,box-shadow .15s,filter .15s}
.t-td .pip{width:34px;height:34px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.45))}
.t-td .pip rect{fill:#E9E1D8;stroke:#1A1012}

<script>// Shared card markup for the chapter dice prototype. The paper build (paper/build.js) prints these cards and the

  // set under it; a rolled die takes out a die showing exactly its number. Which numbers are doubles depends on the
  // analyst; every other die (the solo crew die, the Triage agent die) doubles only on a 6.

  const DOUBLES = { HUN: [1, 2, 6], RES: [3, 4, 6], ENG: [2, 4, 6], SOA: [1, 6], PAT: [3, 6], CREW: [6], AGENT: [6] };
  const isDouble = (id, n) => (DOUBLES[id] || DOUBLES.CREW).includes(n);
  // The persistence row on 2d6: a row mob comes back if the sum is at most its number. The data's d20 ranges map by
  // tier (top 12+ → 8, 10–11 → 7, 8–9 → 6, 7 or less → 5). Same as sim.js rowTop.
  const rowTop = N => N >= 12 ? 8 : N >= 10 ? 7 : N >= 8 ? 6 : 5;

  // two-player hits for a boss. Solo plays the two-player dice.
  const diceFor = (m, boss) => {
    const base = boss ? m.hitsBase + D.bossAdd[2] : m.hits;
    return { base: numbersFor(m.id, base).slice().sort((a, b) => a - b), extra: numbersFor(m.id + '+', 1)[0] };
  };

  const slotsFor = (m, boss, n) => { const d = diceFor(m, boss); return [...d.base, ...Array(Math.max(0, n - 2)).fill(d.extra)]; };

    5: [[4.6, 4.6], [11.4, 4.6], [8, 8], [4.6, 11.4], [11.4, 11.4]], 6: [[4.6, 4.2], [11.4, 4.2], [4.6, 8], [11.4, 8], [4.6, 11.8], [11.4, 11.8]] };
  const pip = (n, px) => `<svg class="pip" viewBox="0 0 16 16" width="${px}" height="${px}" style="display:inline-block;vertical-align:middle" role="img" aria-label="${n}"><rect x=".7" y=".7" width="14.6" height="14.6" rx="3.2" fill="#fff" stroke="${C.ink}" stroke-width="1.1"/>${PIPS[n].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="1.45" fill="${C.ink}"/>`).join('')}</svg>`;

  // ---- Cards (2.5 × 3.5 in) ----------------------------------------------------------------------------------
  const kw = { beacon: 'Beacon', noblock: 'Piercing', onpoint: 'Targeted', hardened: 'Evasive', regen: 'Regen', ramp: 'Escalating' };
  const kwText = { beacon: 'Roll the row when it arrives or comes back.', noblock: 'Blocks don’t stop it.', onpoint: 'Only on point takes its damage, doubled.', hardened: 'Only a double can hit it.', regen: 'At the end of each round, put back one die it lost.', ramp: '+1 Damage every round it stays up.' };

    if (G.phase !== 'loot') fail('The tray isn’t over its limit.');
    const i = G.tray.findIndex(c => c.uid === uid); if (i < 0) fail('No such agent in the tray.');
    const [c] = G.tray.splice(i, 1); G.discard.push(c); say(G, `Discarded ${KIT_NAME[c.t]}.`, 'kit');
    if (G.tray.length <= G.cap) G.phase = 'flip';
    return G;
  }
  // Keep exactly these agents (up to the tray's limit), discard the rest.
  function keepKit(G, uids) {
    if (G.phase !== 'loot') fail('The tray isn’t over its limit.');
    if (uids.length > G.cap) fail(`The tray holds ${G.cap}.`);
    G.tray.filter(c => !uids.includes(c.uid)).forEach(c => discardKit(G, c.uid));
    return G;
  }

  // Containment burn: which die comes off a mob. A repeated number first (it leaves the most different numbers to
  // match), else the highest. Returns a slot index, or -1.
  function containPick(m) {
    const free = m.slots.map((v, i) => i).filter(i => !m.off[i]); if (!free.length) return -1;
    const seen = {}; free.forEach(i => { seen[m.slots[i]] = (seen[m.slots[i]] || 0) + 1; });
    const dup = free.filter(i => seen[m.slots[i]] > 1);
    return (dup.length ? dup : free).reduce((a, b) => m.slots[b] >= m.slots[a] ? b : a);
  }

  // ---- Burns ------------------------------------------------------------------------------------------------------
  const BURN_PHASES = { triage: ['assign'], enrich: ['assign'], contain: ['roll', 'assign'], recover: ['flip', 'roll', 'assign'] };
  const canBurn = (G, t) => !G.over && (BURN_PHASES[t] || []).includes(G.phase) && !(t === 'contain' && !G.play.some(m => left(m) > (m.boss ? 1 : 0)));
  function burn(G, typeOrUid) {
    const c = G.tray.find(x => x.uid === typeOrUid) || G.tray.find(x => x.t === typeOrUid);
    if (!c) fail('No such agent in the tray.');
    if (!canBurn(G, c.t)) fail(`Can’t burn the ${KIT_NAME[c.t]} now.`);
    G.tray.splice(G.tray.indexOf(c), 1); G.discard.push(c); G.undo = [];
    G.stats.burns[c.t] = (G.stats.burns[c.t] || 0) + 1;
    say(G, `Burned the ${KIT_NAME[c.t]}.`, 'burn');
    if (c.t === 'triage') {
      const id = G.team[G.point];
      for (let i = 0; i < 3; i++) G.dice.push({ i: G.dice.length, k: G.point, crew: true, src: 'burn', ...pipDie(1 + d6(G), id), used: null, turned: false });
      say(G, `${nameOf(id)} rolls 3 more: ${G.dice.slice(-3).map(faceText).join(', ')}.`, 'roll');
    }
    if (c.t === 'enrich') { G.wildAll = true; say(G, 'Every die matches anything this round.', 'kit'); }
    if (c.t === 'contain') {
      for (const m of G.play) { if (!left(m) || (m.boss && left(m) <= 1)) continue; take(m, containPick(m)); }
      say(G, 'One die off every mob.', 'kit');
      if (G.phase === 'roll' && G.play.every(m => !left(m))) endRound(G);
    }
    if (c.t === 'recover') spread(G, D.recoverBurn, 'Recovery burn');
    return G;
  }

  return { HP, KIT_NAME, pipDie, rng, shuffle, newGame, setPoint, flip, roll, assign, guard, enrichTurn, unassign, endRound, burn, canBurn,
    discardKit, keepKit, targets, canHit, canGuard, moreSlots, containPick, incoming, dmgOf, left, remaining, running, nameOf, faceText, dieOwner, rollRow };
});
</script>
<script>// Chapter dice web prototype: the page script. Renders the engine state (CDEngine) with the shared paper card

// Throwaway prototype code, inlined into web/index.html by web/build.js.
(function () {
  const E = window.CDEngine, A = window.CDCards, D = window.CD_DATA;
  const app = document.getElementById('app');
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const qs = new URLSearchParams(location.search || '');
  const UI = { G: null, sel: null, more: null, drawer: null, cards: false, start: 0, end: 0, msg: '', err: false, copied: null, seenRow: 0, seenMobs: new Set(),

  const pl = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
  const mmss = ms => { const s = Math.round(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };

  // ---- Actions ------------------------------------------------------------------------------------------------

    try { fn(); UI.msg = okMsg || ''; UI.err = false; }

  function startGame() {

  // After a die is used, select the next unused die that can still do something.
  function nextDie() {
    const G = UI.G; if (!G || G.phase !== 'assign') { UI.sel = null; return; }
    const ok = d => { const t = E.targets(G, d.i); return !d.used && (t.hits.length || t.guard); };
    const after = G.dice.filter(d => d.i > (UI.sel == null ? -1 : UI.sel)).find(ok) || G.dice.find(ok);
    UI.sel = after ? after.i : null;
  }
  function doAssign(di, uid, p, q) { UI.more = null; act(() => E.assign(UI.G, di, uid, p, q)); if (!UI.err) { nextDie(); render(); } }
  function doGuard() { UI.more = null; const i = UI.sel; act(() => E.guard(UI.G, i)); if (!UI.err) { nextDie(); render(); } }
  // Tap a threat die under a card. With a double waiting for its "one more", this is that pick. Otherwise a double's

  function tapSlot(uid, p) {
    const G = UI.G, m = G.play.find(x => x.uid === uid); if (!m || G.phase !== 'assign') return;
    if (UI.more) {
      if (UI.more.uid === uid && p === UI.more.p) { UI.more = null; UI.msg = ''; return render(); }
      if (UI.more.uid !== uid) { UI.msg = 'A double’s one more must come from the same mob.'; UI.err = true; return render(); }
      return doAssign(UI.more.di, uid, UI.more.p, p);

    if (!ok) return doAssign(UI.sel, uid, p); // the engine says why not

  }

  // ---- Copy result -----------------------------------------------------------------------------------------------
  function resultLine() {
    const G = UI.G, burns = Object.entries(G.stats.burns).map(([t, n]) => `${t} ${n}`).join(', ');
    return ['Detect the Dwellers · chapter dice prototype', `${G.team.map(nm).join(' + ')} (${G.n}p)`, `${G.max} HP`,
      `${G.win ? 'Win' : 'Loss'}${G.win ? '' : ` in fight ${G.fight}${G.bossOut ? ' (boss)' : ''}`}`, mmss((UI.end || Date.now()) - UI.start),

  }

  }

  // ---- Views --------------------------------------------------------------------------------------------------------
  function vSetup() {

      <div class="t-field"><p class="t-h">Players</p><div class="t-seg" role="group" aria-label="Players">${[1, 2, 3, 4].map(n => `<button class="t-btn" data-a="count" data-n="${n}" data-k="count${n}" aria-pressed="${S.n === n}">${n}${n === 2 ? ' · tuned' : ''}</button>`).join('')}</div></div>
      <div class="t-field"><p class="t-h">Analysts</p>${S.team.slice(0, S.n).map((id, k) => `<div class="t-seat" role="group" aria-label="Player ${k + 1}"><span class="who">Player ${k + 1}</span>${A.ANALYST_IDS.map(c => `<button class="t-btn sm" data-a="pick" data-seat="${k}" data-id="${c}" data-k="pick${k}${c}" aria-pressed="${id === c}">${nm(c)}</button>`).join('')}</div>`).join('')}</div>
      <div class="t-acts"><button class="t-btn pri" data-a="start" data-k="start">Start the shift</button><button class="t-lnk" data-a="cards" data-k="cards">See all 21 cards</button></div>
      <div class="t-picks">${S.team.slice(0, S.n).map(id => `<div class="t-cslot" data-card="analyst:${id}">${A.analystCard(id)}</div>`).join('')}</div>
    </main>`;
  }
  function vTop() {
    const G = UI.G;
    const where = G.phase === 'flip' || G.phase === 'loot' ? (G.feed.length ? `Next: flip ${G.fight + 1}` : 'Next: the boss') : `Fight <b class="num">${G.fight}</b> · round <b class="num">${G.round || 1}</b>`;
    return `<header class="t-top"><div class="t-brand">Detect the Dwellers<small>Chapter dice · web prototype</small></div>
      <div class="t-meta">${where} · feed <b class="num">${G.feed.length}</b>${G.bossOut ? '' : ' + boss'}</div>
      <nav class="t-nav"><button class="t-lnk" data-a="cards" data-k="cards" aria-pressed="${UI.cards}">Cards</button><button class="t-lnk" data-a="log" data-k="log" aria-pressed="${UI.drawer === 'log'}">Log</button><button class="t-lnk" data-a="quit" data-k="quit">New</button></nav></header>`;
  }
  function vCrew() {
    const G = UI.G, fighting = G.phase === 'assign' || G.phase === 'roll', inc = fighting ? E.incoming(G) : null;
    return `<section class="t-crew" aria-label="Crew">${G.team.map((id, k) => {
      const hp = G.hp[k], pct = hp / G.max * 100, n = inc ? inc.total[k] : 0, after = Math.max(0, hp - n);
      const st = [k === G.point ? '<span class="pt">On point</span>' : ''];
      if (inc) { if (G.blocks[k]) st.push('<span class="bl">Blocking</span>'); st.push(n ? `<span class="in">−${n} incoming${n >= hp ? ' · lethal' : ''}</span>` : '<span class="ok">nothing incoming</span>'); }

  }

  function vRowRoll() {
    const G = UI.G, r = G.lastRow;
    if (!r || r.fight !== G.fight) return `<div class="t-rowroll quiet"><div class="t-pair" aria-hidden="true"><span class="t-amb blank"></span><span class="t-amb blank"></span></div><p><small>Persistence row · 2 amber dice</small>${G.row.length ? `No row roll yet this fight. ${pl(G.row.length, 'mob')} on the row.` : 'The row is empty: nothing to roll.'}</p></div>`;
    const isNew = r.seq > UI.seenRow; UI.seenRow = r.seq;
    return `<div class="t-rowroll${isNew ? ' new' : ''}" role="status" data-roll="${r.roll}"><div class="t-pair" aria-hidden="true">${r.pair.map(amber).join('')}<b class="num">=${r.roll}</b></div><p><small>Row roll · ${esc(r.why)}</small>

      ${r.strikes.length ? `<span class="hit">${r.strikes.map(s => `${esc(s.name)} hits everyone for ${s.dmg}`).join('; ')}.</span>` : ''}</p></div>`;
  }
  // The threat dice set under a card: one per slot, taken ones turned aside. Live state only, never on the card.
  function vThreat(m) {
    const G = UI.G, t = UI.sel != null && G.phase === 'assign' && !UI.more ? E.targets(G, UI.sel) : null;
    const mine = t ? t.hits.filter(h => h.uid === m.uid) : [], more = UI.more && UI.more.uid === m.uid ? E.moreSlots(m, UI.more.p) : null;
    return `<div class="t-threat${m.slots.length > 6 ? ' big' : ''}" role="group" aria-label="Dice under ${esc(m.name)}">${m.slots.map((v, p) => {
      const off = m.off[p], h = mine.find(x => x.p === p), pend = UI.more && UI.more.uid === m.uid && UI.more.p === p, mo = more && more.includes(p);
      const c = ['t-td', off ? 'off' : '', h ? (h.near ? 'tgt near' : 'tgt') : '', pend ? 'pend' : '', mo ? 'tgt more' : '', p >= m.printed ? 'xtra' : '', (t || more) && !off && !h && !mo && !pend ? 'dim' : ''].filter(Boolean).join(' ');
      const label = `${v}${p >= m.printed ? ' (extra die for this crew)' : ''}${off ? ', taken' : h ? (h.near ? ', one off: your perk matches it' : ', matches') : mo ? ', take as one more' : ''}`;
      return `<button class="${c}" data-a="slot" data-u="${m.uid}" data-p="${p}" data-k="slot${m.uid}-${p}" aria-label="${esc(label)}" ${off ? 'disabled' : ''}>${A.pip(v, 30)}</button>`;

  function vMob(m) {
    const G = UI.G, down = !E.left(m);

      if (inc) lines.push(inc.to.length ? `<span class="hot">At round end: ${inc.dmg} to ${inc.to.map(k => nm(G.team[k])).join(', ')}</span>` : '<span>At round end: blocked</span>');

      <div class="row"><span class="run">${loot ? (drawn.has(c.uid) ? 'New' : '') : 'Running'}</span>${loot ? `<button class="t-btn sm warn" data-a="discard" data-u="${c.uid}" data-k="disc${c.uid}">Discard</button>` : `<button class="t-btn sm" data-a="burn" data-u="${c.uid}" data-k="burn${c.uid}" ${E.canBurn(G, c.t) ? '' : 'disabled'} aria-label="Burn the ${E.KIT_NAME[c.t]}">Burn</button>`}</div></div>`).join('')}</div>`
      : '<p class="t-empty">No agents. Win a fight to draw more.</p>';
    return `<aside class="t-side">
      <div class="t-panel"><p class="t-h"><span>Persistence row</span><span>${G.gone.length ? `${G.gone.length} gone for good` : ''}</span></p>${rowHtml}</div>
      <div class="t-panel"><p class="t-h"><span>Kit tray</span><span class="num">${G.tray.length}/${G.cap} · deck ${G.kit.length}</span></p>${kit}</div>

  }
  function dieHtml(d) {

  function vDock() {

    if (G.phase === 'flip') {

      ctl = `<div class="t-acts"><div class="t-pts" role="group" aria-label="On point">${G.team.map((id, k) => `<button class="t-btn sm" data-a="point" data-n="${k}" data-k="point${k}" aria-pressed="${G.point === k}">${nm(id)}</button>`).join('')}</div><span class="sp"></span>
        <button class="t-btn pri" data-a="flip" data-k="flip">${G.feed.length ? 'Flip the next mob' : 'Bring on the boss'} <span class="num">(F)</span></button></div>`;
    } else if (G.phase === 'roll') {

    } else if (G.phase === 'assign') {
      const d = UI.sel != null ? G.dice[UI.sel] : null, t = d ? E.targets(G, d.i) : null, mo = UI.more && G.play.find(m => m.uid === UI.more.uid);
      if (mo) hint = `<b>Double ${d.n} takes the ${mo.slots[UI.more.p]} under ${esc(mo.name)}.</b> Tap any one more die under it, or keep just the one.`;
      else if (!d) hint = G.dice.some(x => !x.used) ? '<b>Tap a die</b>, then a matching die under a mob. Keys 1–9 pick dice.' : '<b>All dice placed.</b> End the round when you’re ready.';
      else if (d.used) hint = `That die is used. <b>Undo</b> to take it back.`;
      else hint = `<b>${esc(E.dieOwner(G, d))}: ${E.faceText(d)}.</b> ${t.hits.length ? (d.dbl ? 'A double: tap a matching die under a mob to take it and one more, <b>or Guard</b>.' : 'Tap a glowing die under a mob that shows the same number.') + (t.hits.some(h => h.near) ? ' Dashed rings are one off: your perk matches them.' : '') : 'Nothing it can hit.'}${G.wildAll ? ' Every die matches anything this round.' : ''}${!d.crew ? ' Agent dice can’t hit the boss or guard.' : ''}`;
      const sel = d && !d.used;
      ctl = `<div class="t-dice" role="group" aria-label="Dice">${G.dice.map(dieHtml).join('')}</div>
        <div class="t-acts">${mo ? `<button class="t-btn pri" data-a="one" data-k="one">Just that one <span class="num">(J)</span></button><button class="t-btn" data-a="back" data-k="back">Back <span class="num">(Esc)</span></button>` : ''}
        ${!mo && sel && t.guard ? `<button class="t-btn" data-a="guard" data-k="guard">Guard <span class="num">(G)</span></button>` : ''}
        ${!mo && sel && t.enrich ? `<span class="t-inc">Enrichment: turn to</span><span class="t-turn">${[1, 2, 3, 4, 5, 6].filter(n => n !== d.n).map(n => `<button class="t-btn sm" data-a="turn" data-n="${n}" data-k="turn${n}" aria-label="Turn this die to ${n}">${A.pip(n, 20)}</button>`).join('')}</span>` : ''}
        <span class="t-inc">${incText()}</span><span class="sp"></span>
        <button class="t-btn" data-a="undo" data-k="undo" ${G.undo.length ? '' : 'disabled'}>Undo <span class="num">(U)</span></button>
        <button class="t-btn pri" data-a="end" data-k="end">End round <span class="num">(E)</span></button></div>`;
    } else if (G.phase === 'loot') {
      hint = `<b>The tray holds ${G.cap}.</b> Discard ${G.tray.length - G.cap} agent${G.tray.length - G.cap === 1 ? '' : 's'} from the kit tray (new ones are ringed).`;
    }
    UI.fresh = false;
    return `<div class="t-dock" role="region" aria-label="Controls"><div class="t-dockin"><p class="t-hint" aria-live="polite">${UI.msg ? `<span class="${UI.err ? 'err' : ''}">${esc(UI.msg)}</span> ` : ''}${hint}</p>${ctl}</div></div>`;
  }
  function incText() {
    const G = UI.G, inc = E.incoming(G), tot = inc.total.reduce((a, b) => a + b, 0);
    return tot ? `Incoming at round end: ${G.team.map((id, k) => `${nm(id)} <b>${inc.total[k]}</b>`).join(' · ')}` : 'Nothing hits back this round.';
  }
  function vLog() {
    if (UI.drawer !== 'log') return '';
    const L = UI.G.log.slice().reverse();
    return `<aside class="t-drawer" aria-label="Game log"><h2>Log <button class="t-lnk" data-a="log" data-k="logx">Close</button></h2><ol class="t-log">${L.map(l => `<li class="${l.kind}"><span class="when">${l.fight ? `F${l.fight}${l.round ? '·R' + l.round : ''}` : '—'}</span>${esc(l.text)}</li>`).join('')}</ol></aside>`;
  }
  function vGallery() {
    if (!UI.cards) return '';
    const all = [...A.mobs().map(m => ['mob:' + m.id, A.mobCard(m)]), ['boss', A.bossCard(A.boss())], ['legend', A.legend], ...A.ANALYST_IDS.map(id => ['analyst:' + id, A.analystCard(id)]), ...A.AGENT_IDS.map(t => ['agent:' + t, A.agentCard(t)])];
    return `<div class="t-gallery" role="dialog" aria-label="All cards"><div class="in"><p class="t-h"><span>Every card in the prototype · the same markup as the paper PDF</span><button class="t-lnk" data-a="cards" data-k="cardsx">Close</button></p>
      <div class="grid">${all.map(([k, h]) => `<div class="t-gslot" data-card="${k}">${h}</div>`).join('')}</div></div></div>`;
  }
  function vEnd() {
    const G = UI.G; if (!G.over) return '';
    const ms = (UI.end || Date.now()) - UI.start;
    return `<div class="t-end" role="dialog" aria-label="Shift over"><div class="t-endc">
      <h2 class="${G.win ? 'win' : 'loss'}">${G.win ? 'Shift survived' : 'Shift lost'}</h2>
      <p class="sub">${G.win ? `${esc(G.boss.name)} is beaten. Everybody walks out.` : `Fight ${G.fight}${G.bossOut ? ', against the boss' : ''}. Someone hit 0 HP.`}</p>
      <div class="t-stats">
        <div><b>${G.stats.rounds}</b><span>Rounds</span></div><div><b>${G.stats.back}</b><span>Comebacks</span></div><div><b>${mmss(ms)}</b><span>Time</span></div>
        <div><b>${G.fight}</b><span>Fights</span></div><div><b>${G.stats.guards}</b><span>Guards</span></div><div><b>${Math.min(...G.hp)}</b><span>Lowest HP</span></div></div>
      <div class="t-acts"><button class="t-btn" data-a="copy" data-k="copy">${UI.copied === 'ok' ? 'Copied' : 'Copy result'}</button><button class="t-btn" data-a="log" data-k="log2">Log</button><span class="sp"></span><button class="t-btn pri" data-a="quit" data-k="again">New shift</button></div>
      ${UI.copied && UI.copied !== 'ok' ? `<textarea class="t-line" rows="4" readonly aria-label="Result line">${esc(UI.copied)}</textarea>` : ''}
      <p class="t-hint" data-line style="margin-top:10px;font-family:var(--mono);font-size:11px">${esc(resultLine())}</p>
    </div></div>`;
  }

  // ---- Render and events ------------------------------------------------------------------------------------------
  function render() {
    const k = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.k : null;
    app.innerHTML = UI.G ? vTop() + vCrew() + `<div class="t-main">${vTable()}${vSide()}</div>` + vDock() + vLog() + vGallery() + vEnd() : vSetup() + vGallery();
    if (k) focusKey(k);
  }
  function focusKey(k) { const el = app.querySelector(`[data-k="${k}"]`); if (el && !el.disabled) el.focus({ preventScroll: true }); }

  app.addEventListener('click', e => {
    const G = UI.G;
    const b = e.target.closest && e.target.closest('[data-a]'); if (!b || b.disabled) return;
    const a = b.dataset.a;
    if (a === 'count') { UI.setup.n = +b.dataset.n; return render(); }
    if (a === 'pick') { const s = UI.setup.team, k = +b.dataset.seat, j = s.indexOf(b.dataset.id); if (j >= 0 && j !== k) s[j] = s[k]; s[k] = b.dataset.id; return render(); }
    if (a === 'start') return startGame();
    if (a === 'cards') { UI.cards = !UI.cards; return render(); }
    if (a === 'log') { UI.drawer = UI.drawer === 'log' ? null : 'log'; return render(); }
    if (a === 'quit') { if (G && !G.over && !confirmQuit()) return; UI.G = null; UI.drawer = null; UI.seed = (UI.seed * 7 + 13) % 1e9; return render(); }
    if (a === 'copy') return copyResult();
    if (!G) return;
    if (a === 'point') return act(() => E.setPoint(G, +b.dataset.n));
    if (a === 'flip') { act(() => E.flip(G)); return focusKey('roll'); }
    if (a === 'roll') { act(() => E.roll(G)); UI.fresh = true; UI.sel = null; UI.more = null; nextDie(); render(); return focusKey('die' + (UI.sel || 0)); }
    if (a === 'die') { const i = +b.dataset.i; UI.more = null; UI.sel = UI.sel === i ? null : i; UI.msg = ''; return render(); }
    if (a === 'slot') return tapSlot(b.dataset.u, +b.dataset.p);
    if (a === 'one') return UI.more && doAssign(UI.more.di, UI.more.uid, UI.more.p);
    if (a === 'back') { UI.more = null; return render(); }
    if (a === 'guard') return doGuard();
    if (a === 'turn') { const i = UI.sel; return act(() => E.enrichTurn(G, i, +b.dataset.n)); }
    if (a === 'undo') { UI.more = null; act(() => E.unassign(G)); const last = G.dice.filter(d => !d.used).map(d => d.i); if (UI.sel == null || (G.dice[UI.sel] && G.dice[UI.sel].used)) UI.sel = last.length ? last[last.length - 1] : null; return render(); }
    if (a === 'end') { UI.sel = null; UI.more = null; act(() => E.endRound(G)); return focusKey(G.phase === 'roll' ? 'roll' : 'flip'); }
    if (a === 'burn') { act(() => E.burn(G, b.dataset.u)); if (G.phase === 'assign' && UI.sel == null) { nextDie(); render(); } return; }
    if (a === 'discard') { act(() => E.discardKit(G, b.dataset.u)); return; }
  });
  const confirmQuit = () => { try { return window.confirm('Abandon this shift?'); } catch (e) { return true; } };
  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey || /INPUT|TEXTAREA|SELECT/.test((e.target || {}).tagName || '')) return;
    const G = UI.G, key = e.key.toLowerCase(), click = k => { const el = app.querySelector(`[data-a="${k}"]`); if (el && !el.disabled) { el.click(); e.preventDefault(); } };
    if (key === 'escape') { if (UI.cards) UI.cards = false; else if (UI.drawer) UI.drawer = null; else if (UI.more) UI.more = null; else UI.sel = null; return render(); }
    if (!G) return;
    if (key === 'l') return click('log');
    if (G.phase === 'flip' && key === 'f') return click('flip');
    if (G.phase === 'roll' && key === 'r') return click('roll');
    if (G.phase === 'assign') {
      if (key === 'j') return click('one');
      if (/^[1-9]$/.test(key) && G.dice[+key - 1]) { UI.more = null; UI.sel = +key - 1; UI.msg = ''; render(); return focusKey('die' + UI.sel); }
      if (key === 'g') return click('guard');
      if (key === 'u' || key === 'backspace') return click('undo');
      if (key === 'e') return click('end');
    }
  });
  window.CDUI = { UI, render, resultLine };
  render();
})();
</script>
</body>
</html>
