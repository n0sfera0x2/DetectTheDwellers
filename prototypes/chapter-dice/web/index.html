.card{--pl:#A8360F;--pa:#FF5A2A;position:relative;isolation:isolate;box-sizing:border-box;border:1px dashed #999;background:#F6F2EC;color:#1A1418;padding:13px 14px 0;display:flex;flex-direction:column;gap:5px;overflow:hidden;font-family:'Chakra Petch',sans-serif}
.card::before,.card::after{content:"";position:absolute;z-index:-1;pointer-events:none}
.card::before{inset:5px;background:var(--pl);clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px))}
.card::after{inset:6.5px;background:#F6F2EC;clip-path:polygon(0 0,calc(100% - 15.4px) 0,100% 15.4px,100% 100%,15.4px 100%,0 calc(100% - 15.4px))}
.card.cy{--pl:#005F73;--pa:#38E1FF}.card.am{--pl:#8A4510;--pa:#FF9B54}
.card>.tab{position:absolute;left:5px;top:5px;width:30px;height:4px;background:var(--pa)}
.card .art{position:relative;flex:none;aspect-ratio:auto;height:92px;margin:0 -1px;overflow:hidden;background:#07060A;color:#F3E9E2;border:3px solid #07060A;outline:1px solid #D8CEC3}
.card .art svg{position:absolute;inset:0;display:block;width:100%;height:100%}
.card.boss .art{height:74px}.card.analyst .art{height:82px}.card.agent .art{height:128px}
.hd{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-top:1px}
.tg{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:10px;line-height:13px;letter-spacing:.04em;text-transform:uppercase;color:#1A1418;background:var(--pa);padding:0 5px;white-space:nowrap}
.hud{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:10px;line-height:13px;letter-spacing:.04em;text-transform:uppercase;color:#8A4510;white-space:nowrap}.card.cy .hud{color:#005F73}
.nr{display:flex;align-items:center;gap:8px}.nr .nm{flex:1;min-width:0}
.nm{font-weight:700;font-size:16px;line-height:1.1;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}.card.boss .nm{color:#A8360F}.card.agent .nm{color:#005F73}
.dmg{flex:none;display:flex;flex-direction:column;align-items:flex-end;background:#fff;border:1px solid #D8CEC3;padding:1px 6px 2px;line-height:1}
.dmg span{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:10px;line-height:12px;letter-spacing:.04em;text-transform:uppercase;color:#5A4B43}.dmg b{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:19px;line-height:20px;color:#1A1418;font-variant-numeric:tabular-nums}
.kw{display:flex;gap:6px;align-items:flex-start;font-size:11px;line-height:1.3;background:#FCE6DC;border:1px solid #FF5A2A;padding:3px 6px}.kw b{font-weight:700;text-transform:uppercase;font-size:11px;color:#A8360F}.kw .kwi{flex:none;margin-top:1px}
.fl{font-size:10px;line-height:1.35;color:#5A4B43;border-top:1px solid #D8CEC3;padding-top:4px}
.dice{margin:auto -7.5px 6.5px;padding:6px 8px 7px;background:#fff;border-top:2px solid #1A1418;display:flex;flex-direction:column;align-items:center;gap:4px;clip-path:polygon(0 0,100% 0,100% 100%,15px 100%,0 calc(100% - 15px))}
.dice .set{display:flex;flex-wrap:wrap;justify-content:center;gap:4px}.boss .dice .set{max-width:150px}
.dice .plus{display:flex;align-items:center;gap:4px;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:#5A4B43}.dice .plus b{font-size:14px;color:#1A1418}
.dbls{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.dface{background:#fff;border:1px solid #D8CEC3;height:34px;display:flex;align-items:center;justify-content:center}
.perk{font-size:11px;line-height:1.33;font-weight:600;background:#fff;border:1px solid #005F73;padding:4px 7px;margin-top:auto;margin-bottom:11px}
.ex{display:flex;align-items:center;gap:5px;font-size:11px;color:#5A4B43;background:#fff;border:1px solid #D8CEC3;padding:5px 7px}
.note{font-size:11px;line-height:1.35;color:#5A4B43}.note svg{vertical-align:-2px}.note b{color:#1A1418}
.card.ref .kw{display:block}.card.ref .kw b{text-transform:none;font-size:inherit}
.card.sit .art{height:74px}.card.sit .fl{border-top:0;padding-top:0}.card.sit .nm{color:#8A4510}
.srule{font-size:11px;line-height:1.3;font-weight:600}
.opt{font-size:11px;line-height:1.3;background:#fff;border:1px solid #D8CEC3;padding:3px 6px}.opt b{display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:#8A4510}
.card.cond{justify-content:flex-start;gap:10px;padding-top:20px}.card.cond .nm{font-size:22px}.card.cond.cy .nm{color:#005F73}.card:not(.cy).cond .nm{color:#A8360F}.ctext{font-size:14px;line-height:1.35;font-weight:600}
.mode{font-size:12px;line-height:1.35;border-top:1px solid #D8CEC3;padding-top:4px}.mode b{display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:#005F73}.mode:last-child b{color:#8A4510}.small{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
/* Chapter dice web prototype: the night table, in the real game's look (ui/head.html, Ink & Static): the same tokens,
   chamfered buttons and panels, the paper cards set on a dark desk, the dice tray, and its motion. Card faces use the
   shared paper card CSS (../cards.js CARD_CSS); this file only places them and adds live state around them.
   Motion animates transform, opacity and filter only. */
:root{--bg:#07060A;--ink:#F3E9E2;--mut:#B9A99E;--fl:#FF5A2A;--am:#FF9B54;--cy:#38E1FF;
--s1:#110E13;--s2:#19151C;--s3:#2A2329;--rule:rgba(243,233,226,.12);--rule2:rgba(243,233,226,.24);--line:rgba(255,155,84,.42);--cl:rgba(56,225,255,.5);--off:#9A8F89;
--pp:#F6F2EC;--pk:#1A1418;--pm:#5A4B43;--pr:#D8CEC3;--flt:#A8360F;--cyt:#005F73;--amt:#8A4510;
--disp:"Chakra Petch",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
--ch:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px));
--chp:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px));
--ease:cubic-bezier(.16,1,.3,1);color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07060A}}:root[data-theme="dark"],:root[data-theme="light"]{--bg:#07060A}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scrollbar-color:var(--s3) var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);font:500 16px/1.45 var(--disp);letter-spacing:.005em;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  background:radial-gradient(70% 50% at 85% -10%,rgba(56,225,255,.07),transparent 70%),radial-gradient(50% 40% at 0% 110%,rgba(255,155,84,.06),transparent 70%),var(--bg);background-attachment:fixed}
::selection{background:var(--cy);color:#04141a}
button{font:inherit;color:inherit;border-radius:0}
:focus-visible{outline:2px solid var(--cy);outline-offset:3px}
h1,h2,h3,p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:16px;height:16px;flex:none;vertical-align:-3px}
.num{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:0}
.meta{font-weight:500;font-size:14px;line-height:1.35;letter-spacing:.01em;color:var(--mut)}.meta.c{color:var(--cy)}.meta.f{color:var(--fl)}
.logo{font-weight:700;text-transform:uppercase;letter-spacing:-.01em;line-height:.92;font-size:clamp(40px,5.6vw,80px);color:var(--ink);text-wrap:balance}
.nm{font-weight:700;text-transform:uppercase;letter-spacing:.02em;line-height:1.08}
.lede{font-size:clamp(16px,1.4vw,19px);line-height:1.5;max-width:56ch}
kbd{font-family:var(--mono);font-weight:600;font-size:11px;line-height:1;padding:3px 5px;border:1px solid currentColor;opacity:.75;letter-spacing:0}
@media (hover:none){kbd{display:none!important}}
.wrap{max-width:1440px;margin:0 auto;padding:20px clamp(16px,3vw,32px) 32px}
.panel{position:relative;border:1px solid var(--rule);background:var(--s1)}.panel.c{border-color:var(--cl)}.pad{padding:12px 14px}
.art{display:block;width:100%;aspect-ratio:200/112;overflow:hidden;background:#07060A}.art svg{display:block;width:100%;height:100%}
.sech{font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--cy);display:flex;gap:8px;align-items:center;margin:0 0 8px}
.sech::before{content:"";width:6px;height:6px;background:currentColor;flex:none}.sech.f{color:var(--fl)}.sech.a{color:var(--am)}
.sech .cnt{margin-left:auto;font-family:var(--mono);font-weight:600;font-size:11px;letter-spacing:.04em;color:var(--mut)}
.empty{border:1px dashed var(--rule2);padding:8px 12px;font-size:14px;color:var(--mut)}
.phud{font-weight:700;font-size:12px;line-height:1.35;letter-spacing:.06em;text-transform:uppercase;color:var(--pm)}.phud.c{color:var(--cyt)}
.safe{color:var(--cy)}

/* Buttons: the chamfer lives on pseudo-elements so the focus ring shows */
.btn{--bd:var(--line);--fill:var(--s1);--tx:var(--ink);position:relative;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:9px 16px;border:0;background:none;color:var(--tx);cursor:pointer;
  font-weight:700;font-size:15px;line-height:1.15;letter-spacing:.06em;text-transform:uppercase;text-align:center;transition:transform .12s var(--ease)}
.btn::before,.btn::after{content:"";position:absolute;z-index:-1;clip-path:var(--ch);transition:background-color .15s}
.btn::before{inset:0;background:var(--bd)}.btn::after{inset:1px;background:var(--fill)}
.btn:hover:not(:disabled){--fill:var(--s3)}.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{cursor:not-allowed;--tx:var(--off);--bd:rgba(243,233,226,.16)}
.btn.p{--bd:var(--cy);--fill:var(--cy);--tx:#04141a}.btn.p:hover:not(:disabled){--fill:#8DEEFF;--bd:#8DEEFF}
.btn.cy{--bd:var(--cl);--tx:var(--cy)}.btn.cy:hover:not(:disabled){--fill:rgba(56,225,255,.12)}
.btn.warn{--bd:var(--fl);--fill:var(--fl);--tx:#160904}.btn.warn:hover:not(:disabled){--fill:#FF7A52;--bd:#FF7A52}
.btn.s{min-height:36px;padding:6px 12px;font-size:13px}.btn.w{width:100%}.btn.big{min-height:52px;font-size:16px}
.btn[aria-pressed="true"]:not(.snd){--bd:var(--cy);--tx:var(--cy)}
.btn kbd{border-color:currentColor}
.lnk{background:none;border:0;padding:0 2px;color:var(--cy);font-weight:500;font-size:inherit;cursor:pointer;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}
.lnk:hover{text-decoration-thickness:2px}
.snd .ic{margin-right:2px}.snd[aria-pressed="false"]{--tx:var(--mut)}.snd[aria-pressed="false"] span{text-decoration:line-through;text-decoration-thickness:1px}

/* ---- Crew pick (as the real game's intro) ---- */
.intro-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(20px,3vw,44px);align-items:start}
.hero{display:flex;flex-direction:column;gap:14px}.hero .art{border:1px solid var(--rule);aspect-ratio:200/96}
.t-note{border:1px solid rgba(255,90,42,.5);background:rgba(255,90,42,.08);padding:8px 12px;font-size:15px;max-width:60ch}.t-note b{color:#FFB49C}
.setup{display:flex;flex-direction:column;gap:12px;padding:18px 20px 0}
.picks{display:grid;gap:6px}
.pick{display:grid;grid-template-columns:132px minmax(0,1fr) auto;align-items:center;gap:14px;width:100%;padding:0 12px 0 0;border:1px solid var(--rule2);background:var(--s2);text-align:left;cursor:pointer;min-height:96px;transition:border-color .15s}
.pick .art{height:100%;aspect-ratio:3/2;min-height:96px}.pick .nm{font-size:17px}
.pick .pk-t{display:flex;flex-direction:column;gap:3px;padding:8px 0}.pick .pk-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.pick .style{font-weight:700;font-size:13px;line-height:1.2;letter-spacing:.06em;text-transform:uppercase;color:var(--am)}
.pick .dbl{display:flex;align-items:center;gap:4px}.pick .dbl .phud{color:var(--mut);margin-right:4px;font-size:11px}
.pick .pk-perk{font-size:14px;line-height:1.35;color:var(--mut)}
.pick .st{font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);display:inline-flex;gap:4px;align-items:center}
.pick:hover:not(:disabled){border-color:var(--cy)}
.pick[aria-pressed="true"]{border-color:var(--cy);box-shadow:inset 0 0 0 1px var(--cy);background:#0E1A1F}.pick[aria-pressed="true"] .st{color:var(--cy)}
.pick:disabled{opacity:.4;cursor:not-allowed}
.startbar{position:sticky;bottom:0;z-index:5;margin:4px -20px 0;padding:12px 20px calc(14px + env(safe-area-inset-bottom,0px));background:var(--s1);border-top:1px solid var(--rule);display:flex;flex-direction:column;gap:8px}

/* ---- Top bar: brand, shift clock, feed, buttons; crew HP ---- */
.wrap.game{padding-top:0;padding-bottom:280px}
.gtop{position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;align-items:center;gap:8px 22px;margin:0 calc(-1 * clamp(16px,3vw,32px));padding:10px clamp(16px,3vw,32px);background:rgba(7,6,10,.96);border-bottom:1px solid var(--rule)}
.top{display:flex;align-items:center;gap:10px 18px;flex:1 1 440px;min-width:0}
.brand{font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;line-height:1.05}
.brand small{display:block;font-family:var(--mono);font-weight:600;font-size:10.5px;letter-spacing:.08em;color:var(--am)}
.feed{display:flex;flex-direction:column;gap:5px;flex:1 1 180px;min-width:0;max-width:320px}
.fline{display:flex;align-items:baseline;gap:8px;min-width:0}.fline .meta{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feedbar{display:flex;gap:3px}.feedbar i{flex:1;height:7px;background:var(--s3)}.feedbar i.done{background:var(--am)}.feedbar i.now{background:var(--ink)}
.feedbar i.boss{flex:1.8;background:transparent;border:1px solid var(--fl)}.feedbar i.boss.now{background:var(--fl)}.feedbar i.next{background:transparent;box-shadow:inset 0 0 0 1px var(--ink)}.feedbar i.boss.next{box-shadow:inset 0 0 0 1px var(--fl)}
.clk{font-family:var(--mono);font-weight:600;font-size:13px;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink);padding:3px 5px;border:1px solid var(--rule2);flex:none}
.clk.f{color:var(--fl);border-color:rgba(255,90,42,.5)}.clk.dawn{color:var(--cy);border-color:var(--cl);margin-right:6px;vertical-align:2px}
.tbtns{display:flex;gap:6px;align-items:center;margin-left:auto}
.crew{display:flex;gap:6px;flex:0 1 auto;min-width:0}
.pc{display:flex;flex-direction:column;gap:4px;min-width:150px;max-width:220px;padding:6px 10px 7px;border:1px solid var(--rule);background:var(--s1)}
.pc.on{border-color:var(--cl);background:#0E171B}
.pc-h{display:flex;align-items:baseline;gap:8px;min-width:0}
.pc .nm{font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc .dot{width:7px;height:7px;background:var(--cy);flex:none;align-self:center}
.hpn{display:flex;align-items:baseline;gap:2px;white-space:nowrap}.hpn b{font-size:20px;line-height:1}.hpn .of{font-family:var(--mono);font-weight:400;font-size:12px;color:var(--mut)}
.hpbar{position:relative;height:7px;background:var(--s3);overflow:hidden}.hpbar i{position:absolute;inset:0;background:var(--cy);transform-origin:left;transition:transform .4s var(--ease)}.hpbar.low i{background:var(--am)}
.hpbar i.inci{background:var(--fl);transition:transform .2s var(--ease)}
.inc{font-weight:500;font-size:13px;line-height:1.3;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.inc b{color:var(--fl);font-weight:700}.inc.safe,.inc.safe b{color:var(--cy)}.inc b.pt{color:var(--cy)}
.inc .ic{width:13px;height:13px;margin-right:3px}
.flash .hpbar{animation:hit .7s steps(1) 1}.flash .hpn b{animation:hitn .7s steps(1) 1}
@keyframes hit{0%,30%,60%{filter:none}15%,45%{filter:brightness(0) invert(1)}}@keyframes hitn{0%,30%,60%{color:var(--ink)}15%,45%{color:var(--fl)}}

/* ---- Layout: the table and the side column ---- */
.t-main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;margin-top:14px}
.t-side{display:flex;flex-direction:column;gap:14px;min-width:0}
.table{display:flex;flex-direction:column;border:1px solid var(--rule2);background:var(--s1);min-width:0}
.fhead{display:flex;align-items:center;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;padding:10px 14px 0}.fhead .sech{margin:0}
.bans{display:flex;flex-direction:column;gap:6px;margin:10px 14px 0}
.pbanner{display:flex;gap:12px;align-items:center;padding:8px 12px;border:1px solid var(--rule2);background:var(--bg)}
.pbanner p{font-size:15px;line-height:1.45;max-width:70ch;transition:opacity .2s linear}.pbanner.rolling p{opacity:.3}
.pbanner .lead{font-weight:700;margin-right:4px}.pbanner .lead.f{color:var(--fl)}
.pbanner.hot{border-color:var(--am);background:#1A120C}.pbanner.hot p b{color:var(--am)}
.pbanner.boss{border-color:rgba(255,90,42,.6);background:rgba(255,90,42,.07)}
.pbanner .hit{display:block;color:#FF9478}.pbanner .hit b{color:#FF9478}
.t-pair{flex:none;display:flex;align-items:center;gap:6px}
.t-pair>b{font-size:20px;color:var(--am);margin-left:2px;min-width:3ch}
.t-amb{display:block;width:36px;height:36px;line-height:0}.t-amb .f{display:block}
.t-amb .pip{width:36px;height:36px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.5))}.t-amb .pip rect{fill:var(--am);stroke:#1A1012}.t-amb .pip circle{fill:#1A1012}
.t-amb.rolling{animation:dtumble .16s linear infinite}.t-amb.landed{animation:land .3s var(--ease)}
.t-aloud{border:1px solid var(--cl);background:#0C171B;padding:8px 14px}
.aloud{display:block;margin-bottom:3px;font-family:var(--mono);font-weight:600;font-size:11px;line-height:1.3;letter-spacing:.06em;text-transform:uppercase;color:var(--cy)}
.t-aloud p{font-size:16px;line-height:1.45;max-width:70ch}
.reveal-ln .ln{display:inline;animation:lnin .5s var(--ease) both;animation-delay:calc(var(--i) * 420ms + 380ms)}
@keyframes lnin{from{opacity:0;filter:blur(3px)}to{opacity:1;filter:none}}
.status{font-size:16px;line-height:1.45;color:var(--ink);max-width:70ch}.status b{color:var(--cy);font-weight:700}.status .err{color:#FF9478}
.status.pad{padding:16px 14px}

/* A lone mob: one centred pair, the card and beside it the banners and the round in plain words */
.solo-b{display:flex;flex-direction:column}.solo-b .sb{order:-1}.solo-b .rbrief{display:none}
@media (min-width:1041px){
  .solo-b{display:grid;grid-template-columns:auto minmax(0,440px);justify-content:center;gap:0 32px;align-items:start;padding:0 14px}
  .solo-b .sb{order:0;display:flex;flex-direction:column;gap:14px;padding:16px 0}.solo-b .bans{margin:0}.solo-b .rbrief{display:flex}
  .solo-b .inplay{padding:16px 0}
}
.rbrief{flex-direction:column;gap:6px}.rbrief .sech{margin:0}
.rbrief ul{list-style:none;margin:0;padding:0}
.rbrief li{display:grid;grid-template-columns:92px minmax(0,1fr);gap:14px;align-items:baseline;padding:9px 0;border-top:1px solid var(--rule);font-size:15px;line-height:1.45;text-wrap:pretty}
.rbrief li:last-child{border-bottom:1px solid var(--rule)}.rbrief li b{color:var(--ink)}.rbrief li b.num{color:var(--fl)}
.rbrief .phud{letter-spacing:.08em}.rbrief .phud.c{color:var(--cy)}.rbrief .phud.f{color:var(--fl)}.rbrief .phud.a{color:var(--am)}

/* ---- Mobs on the table: the paper cards, with the threat dice set just below ---- */
.inplay{display:flex;flex-wrap:wrap;justify-content:center;gap:18px;padding:14px 14px 16px}
.t-slot{position:relative;display:flex;flex-direction:column;gap:6px;--z:1.15}
.inplay.many .t-slot{--z:1}
.t-slot .card,.t-kslot .card,.t-cslot .card,.t-gslot .card,.rv-card .card{width:240px;height:336px;border:0}
.t-slot .card,.t-gslot .card,.rv-card .card{clip-path:var(--chp)}
.t-slot .card{zoom:var(--z)}
.t-slot.flipin{animation:flipin .5s var(--ease) both}
@keyframes flipin{from{transform:perspective(1100px) rotateY(-78deg);opacity:.3}to{transform:none;opacity:1}}
.t-slot.fresh{animation:rise .32s var(--ease)}@keyframes rise{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.t-slot.struck .card .art{animation:hit .45s steps(1) 1}
.t-slot.struck .card{animation:jolt .28s var(--ease)}
@keyframes jolt{0%{transform:none}30%{transform:translateX(-3px) rotate(-.4deg)}65%{transform:translateX(2px)}100%{transform:none}}
.t-slot.down .card{filter:grayscale(.9) brightness(.55)}
.t-slot.ko .card{animation:ko .42s var(--ease) both}
@keyframes ko{0%{transform:none;filter:none}35%{transform:scale(1.015);filter:brightness(1.6)}100%{transform:scale(.97);filter:grayscale(.9) brightness(.55)}}
.t-slot.down .t-threat,.t-slot.down .t-under{opacity:.55}
.t-stamp{position:absolute;pointer-events:none;z-index:2;font-weight:700;text-transform:uppercase;line-height:1;background:rgba(7,6,10,.84)}
.bstamp{left:12px;top:16px;padding:3px 10px;border:3px solid var(--am);color:var(--am);font-size:19px;letter-spacing:.12em;transform:rotate(-8deg);transform-origin:left top}
.bstamp.new{animation:stampb .42s var(--ease) .5s both}
@keyframes stampb{from{opacity:0;transform:rotate(-8deg) scale(1.6)}to{opacity:1;transform:rotate(-8deg) scale(1)}}
.t-stamp.beat{left:50%;top:calc(66px * var(--z));padding:4px 14px;border:3px solid var(--cy);color:var(--cy);font-size:26px;letter-spacing:.12em;transform:translate(-50%,-50%) rotate(-8deg)}
.t-stamp.beat.new{animation:stamp .4s var(--ease) .2s both}
@keyframes stamp{from{opacity:0;transform:translate(-50%,-50%) rotate(-8deg) scale(1.4)}to{opacity:1;transform:translate(-50%,-50%) rotate(-8deg) scale(1)}}
.t-under{font-size:13px;color:var(--mut);width:calc(240px * var(--z));display:flex;flex-direction:column;gap:3px}
.t-under b{color:var(--ink)}.t-under .hot,.t-under .hot b{color:#FF9478}
/* The threat dice under a card: live state, not part of the card face. Taken dice turn aside. */
.t-threat{width:calc(240px * var(--z));display:flex;flex-wrap:wrap;justify-content:center;gap:7px;padding:6px 4px 2px}
.t-td{position:relative;isolation:isolate;padding:0;border:0;background:none;width:36px;height:36px;line-height:0;border-radius:7px;cursor:pointer;transition:transform .18s var(--ease),opacity .18s}
.t-td .pip{width:36px;height:36px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.5))}
.t-td .pip rect{fill:#E9E1D8;stroke:#1A1012}
.t-td.xtra::after{content:"+";position:absolute;top:-7px;right:-6px;font:700 11px/14px var(--mono);width:14px;height:14px;border-radius:50%;background:var(--am);color:#1A1012;text-align:center}
.t-td.off{transform:translateY(5px) rotate(-24deg) scale(.82);opacity:.32;cursor:default}
.t-td.off .pip rect{fill:#7A6F69}
.t-td.just{animation:taken .45s var(--ease)}
@keyframes taken{0%{transform:scale(1.25);opacity:1}100%{transform:translateY(5px) rotate(-24deg) scale(.82);opacity:.32}}
.t-td .burst{position:absolute;inset:-8px;z-index:-1;pointer-events:none;border-radius:10px;background:var(--cy);opacity:0;animation:burst .7s var(--ease) 1}
@keyframes burst{0%{opacity:.9;transform:scale(.7)}100%{opacity:0;transform:scale(1.6)}}
.t-td.tgt{box-shadow:0 0 0 2px var(--cy),0 0 14px rgba(56,225,255,.65);animation:bob 1.4s ease-in-out infinite}
.t-td.tgt .pip rect{fill:#fff}
.t-td.tgt.near{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--cy);animation:none;outline:2px dashed var(--cy);outline-offset:4px}
.t-td.tgt.more{box-shadow:0 0 0 2px var(--am),0 0 14px rgba(255,155,84,.7)}
.t-td.pend{transform:translateY(5px) rotate(-14deg) scale(.9);box-shadow:0 0 0 2px var(--am);opacity:.75}
.t-td.dim{opacity:.5}
.t-td.tgt:hover{transform:translateY(-3px)}
.t-threat.big .t-td,.t-threat.big .t-td .pip{width:31px;height:31px}
@keyframes bob{50%{transform:translateY(-3px)}}

/* ---- Between fights: the feed face down, who's on point ---- */
.pdesk{display:grid;grid-template-columns:clamp(200px,19vw,250px) minmax(0,1fr);gap:20px 36px;align-items:start;padding:18px 18px 20px}
.pd-feed{padding:0 14px 14px 0}
.pd-side{display:flex;flex-direction:column;gap:18px;min-width:0}
.fdown{position:relative;isolation:isolate;display:block;width:100%;aspect-ratio:5/7;padding:0;border:1px solid var(--rule2);background:#07060A;color:var(--ink);cursor:pointer;text-align:center;transition:transform .2s var(--ease),border-color .2s;box-shadow:0 14px 28px rgba(0,0,0,.5)}
.fdown .fd-art{position:absolute;inset:0;overflow:hidden}.fdown .fd-art svg{display:block;width:100%;height:100%}
.fdown::before,.fdown::after{content:"";position:absolute;inset:-1px;z-index:-1;background:#0E0B12;border:1px solid var(--rule2)}
.fdown::before{transform:translate(calc(min(var(--stack,0),1) * 6px),calc(min(var(--stack,0),1) * 6px))}
.fdown::after{transform:translate(calc(min(max(var(--stack,0) - 1,0),1) * 12px),calc(min(max(var(--stack,0) - 1,0),1) * 12px));z-index:-2}
.fd-t{position:absolute;left:8%;right:8%;top:8%;font-weight:700;font-size:clamp(19px,1.9vw,24px);line-height:1.05;letter-spacing:.02em;text-transform:uppercase;text-wrap:balance}
.fd-b{position:absolute;left:0;right:0;bottom:0;padding:28px 6% 8%;display:flex;flex-direction:column;align-items:center;gap:8px;background:linear-gradient(to top,rgba(7,6,10,.94) 55%,rgba(7,6,10,0))}
.fd-b b{font-weight:700;font-size:13px;line-height:1.2;letter-spacing:.1em;text-transform:uppercase;color:var(--cy)}
.fd-b span{display:inline-flex;align-items:center;min-height:40px;padding:6px 16px;background:var(--cy);color:#04141a;font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;clip-path:var(--ch)}
.fdown:hover{transform:translateY(-4px);border-color:var(--cy)}.fdown:hover .fd-b span{background:#8DEEFF}
.fdown.boss{border-color:var(--fl)}.fdown.boss .fd-b b{color:var(--fl)}.fdown.boss .fd-b span{background:var(--fl);color:#160904}
.acards{display:flex;gap:12px;flex-wrap:wrap}
.acard{--pl:var(--pm);--pa:var(--pm);position:relative;isolation:isolate;width:150px;display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:13px 13px 14px;border:0;background:var(--pp);color:var(--pk);clip-path:var(--chp);text-align:left;cursor:pointer;transition:transform .2s var(--ease)}
.acard::before,.acard::after{content:"";position:absolute;z-index:-1;pointer-events:none}
.acard::before{inset:5px;background:var(--pl);clip-path:polygon(0 0,calc(100% - 13px) 0,100% 13px,100% 100%,13px 100%,0 calc(100% - 13px))}
.acard::after{inset:6px;background:var(--pp);clip-path:polygon(0 0,calc(100% - 12.6px) 0,100% 12.6px,100% 100%,12.6px 100%,0 calc(100% - 12.6px))}
.acard>.tab{position:absolute;left:5px;top:5px;width:34px;height:4px;background:var(--pa)}
.acard.on{--pl:var(--cyt);--pa:var(--cy)}
.acard .scr{position:relative;display:block;overflow:hidden;aspect-ratio:3/2;background:#07060A;border:3px solid #07060A;outline:1px solid var(--pr)}.acard .scr svg{position:absolute;inset:0;width:100%;height:100%}
.acard .nm{font-size:15px}.acard:hover{transform:translateY(-3px)}

/* ---- Side: persistence row, kit tray, crew cards ---- */
.t-rowlist{display:flex;flex-direction:column;gap:8px}
.rcard{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px;align-items:stretch;padding:6px;border:1px solid var(--line);background:#160F0B}
.rcard .scr{position:relative;display:block;overflow:hidden;background:#07060A;min-height:56px}.rcard .scr svg{position:absolute;inset:0;width:100%;height:100%}
.rc-b{display:flex;flex-direction:column;gap:3px;min-width:0}.rc-b .nm{font-size:13px;line-height:1.1}
.rng{font-family:var(--mono);font-weight:600;font-size:11px;letter-spacing:.02em;text-transform:uppercase;color:var(--am);white-space:nowrap}
.t-track{display:grid;grid-template-columns:repeat(11,1fr);gap:1px;height:15px;margin-top:auto}
.t-track i{background:var(--s3);font-style:normal;font-family:var(--mono);font-size:9px;line-height:15px;text-align:center;color:var(--off);font-variant-numeric:tabular-nums}
.t-track i.on{background:rgba(255,155,84,.55);color:#1A1012}.t-track i.roll{background:var(--ink);color:#07060A}.t-track i.on.roll{background:var(--am);box-shadow:0 0 6px var(--am)}
.t-kit{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
/* Agents on the mat: below the mobs, cards near full size, a Triage Agent's die set just under its card */
.t-agents{border-top:1px solid var(--line);padding:12px 14px 16px;display:flex;flex-direction:column;gap:10px}.t-agents .sech{margin:0}
.t-agents .t-kit{display:flex;flex-wrap:wrap;justify-content:center;gap:16px 18px}
.t-agents .t-kslot{--z:.78}
.t-adice{display:flex;justify-content:center;gap:6px;width:calc(240px * var(--z));min-height:78px}
.t-dph{box-sizing:border-box;width:68px;height:78px;border:1px dashed rgba(243,233,226,.35);display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--mono);font-weight:600;font-size:10.5px;line-height:1.3;letter-spacing:.04em;text-transform:uppercase;color:var(--off)}
/* Card peek: a hovered (or tapped) small card shown full size beside it */
.t-peek{position:fixed;left:0;top:0;z-index:80;pointer-events:none;opacity:0;transform:scale(.97);transition:opacity .12s var(--ease),transform .12s var(--ease);filter:drop-shadow(0 14px 32px rgba(0,0,0,.75))}
.t-peek.on{opacity:1;transform:none}
.t-peek .card{width:240px;height:336px;border:0;zoom:var(--pz,1.5);clip-path:var(--chp)}
.t-kslot .card,.t-cslot .card,.t-slot .card{cursor:zoom-in}
.t-agnote{align-self:center;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--cy);white-space:nowrap;padding:0 6px}
.t-kslot{display:flex;flex-direction:column;gap:6px;align-items:flex-start;--z:.55}

/* ---- The dice tray (sticky bottom) ---- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;border-top:1px solid var(--rule2);background:var(--s2);box-shadow:0 -12px 24px rgba(0,0,0,.45);padding:10px clamp(16px,3vw,32px) calc(12px + env(safe-area-inset-bottom,0px))}

.t-die{--bd:rgba(243,233,226,.55);--fill:var(--bg);position:relative;isolation:isolate;width:68px;height:78px;padding:6px 2px 4px;border:0;background:none;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;transition:transform .12s var(--ease)}

/* A double: amber face ring and label, like the d20's natural 18-20 */

.t-die.half .pip{opacity:.75}.t-die.half{--bd:var(--am);border-style:dashed}
.t-die.used{--bd:#776D72;--fill:var(--s1);cursor:default}.t-die.used .pip{opacity:.45}.t-die.used .o{color:var(--off)}
.t-die .gmark{position:absolute;top:-4px;right:-2px;width:17px;height:17px;display:flex;align-items:center;justify-content:center;background:var(--s2);color:var(--cy);border:1px solid var(--cl)}.t-die .gmark .ic{width:11px;height:11px}
.t-die.grd{--bd:var(--cy);--fill:#0E2129}.t-die.grd .o{color:var(--cy)}.t-die.grd .gmark{background:var(--cy);color:#04141a}
.t-die .badge{position:absolute;top:-6px;right:-6px;font-family:var(--mono);font-size:9.5px;font-weight:700;padding:1px 4px;background:var(--am);color:#1A1012}
.t-die.rolling{animation:dtumble .16s linear infinite}.t-die.rolling,.t-die.rolling[aria-pressed="true"]{--fill:var(--s3);--bd:var(--mut)}.t-die.rolling .o,.t-die.rolling kbd,.t-die.rolling .gmark{opacity:0}
@keyframes dtumble{0%{transform:rotate(-14deg) translateY(-2px)}50%{transform:rotate(12deg) translateY(1px)}100%{transform:rotate(-14deg) translateY(-2px)}}
.t-die.landed{animation:land .3s var(--ease)}.t-die.dbl.landed{animation:natland .55s var(--ease)}
@keyframes land{0%{transform:scale(1.2)}100%{transform:none}}
@keyframes natland{0%{transform:scale(1.28);filter:drop-shadow(0 0 0 transparent)}35%{filter:drop-shadow(0 2px 10px rgba(255,155,84,.85))}100%{transform:none;filter:none}}

/* ---- Situations: the card where the mob would be, the top mob face up beside it, the choice beside them ---- */
.t-sit{display:grid;grid-template-columns:auto minmax(0,440px);justify-content:center;gap:16px 32px;align-items:start;padding:16px 14px 18px}

.sit-dice.won .tag{background:var(--cy);color:#04141a}.sit-dice.lost .tag{background:var(--fl);color:#1A1012}
/* Condition cards a player holds: tiny beside their HP, full size on hover or tap */
.t-conds{display:flex;flex-wrap:wrap;gap:4px 8px}
.t-condc{display:flex;align-items:center;gap:5px}.t-condc .card{width:240px;height:336px;border:0;zoom:.12;clip-path:var(--chp);cursor:zoom-in}
.t-condc b{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--fl)}.t-condc.focused b{color:var(--cy)}
@media (max-width:1040px){.t-conds{flex-wrap:nowrap;gap:6px;min-width:0}.t-condc{gap:3px;min-width:0}.t-condc .card{zoom:.1}.t-condc b{font-size:9.5px;letter-spacing:.03em}}
@media (max-width:760px){.t-sit{grid-template-columns:minmax(0,1fr);padding:12px 10px 14px}.t-sslot{--z:.8}.t-sit .t-slot.faceup{--z:.62}.sit-cards{flex-wrap:nowrap;gap:10px}}

/* ---- Overlays: log drawer, gallery, boss reveal, end ---- */
.logp{position:fixed;top:0;right:0;bottom:0;z-index:70;width:min(400px,100%);background:var(--s1);border-left:1px solid var(--rule2);box-shadow:-16px 0 32px rgba(0,0,0,.55);display:flex;flex-direction:column;gap:10px;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));animation:slide .25s var(--ease)}
@keyframes slide{from{transform:translateX(30px);opacity:0}}

.log p.row{border-left-color:var(--am)}.log p.hurt,.log p.end{border-left-color:var(--fl)}.log p.heal,.log p.guard{border-left-color:var(--cy)}.log p.flip,.log p.win{color:var(--ink)}

.t-end{position:fixed;inset:0;z-index:60;background:rgba(5,4,7,.94);overflow:auto;padding:24px clamp(16px,3vw,32px);animation:fade .3s linear}
.end{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.endcard{border:1px solid var(--rule2);background:var(--s1)}.endcard.win{border-color:var(--cl)}.endcard.loss{border-color:rgba(255,90,42,.6)}
.ec-art{position:relative;overflow:hidden}.ec-art .art{aspect-ratio:200/76}
.stamp{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-9deg);padding:6px 20px;border:4px solid var(--cy);color:var(--cy);background:rgba(7,6,10,.78);font-weight:700;font-size:clamp(28px,6vw,60px);letter-spacing:.14em;text-transform:uppercase;line-height:1;white-space:nowrap;animation:stampe .45s var(--ease) .25s both}
.loss .stamp{border-color:var(--fl);color:var(--fl)}
@keyframes stampe{from{opacity:0;transform:translate(-50%,-50%) rotate(-9deg) scale(1.25)}to{opacity:1;transform:translate(-50%,-50%) rotate(-9deg) scale(1)}}
.ec-bd{padding:20px 22px 22px;display:flex;flex-direction:column;gap:14px}.ec-bd .logo{font-size:clamp(38px,5vw,64px)}
.win .logo{color:var(--ink)}.loss .logo{color:var(--fl)}

  .pick{grid-template-columns:76px minmax(0,1fr) auto;align-items:start;gap:10px;min-height:0}.pick .art{height:76px;min-height:0;aspect-ratio:auto}
  .pick .pk-t{padding:7px 0 9px}.pick .pk-perk{font-size:13px}.pick .st{align-self:center;font-size:12px}
  .setup{padding:14px 14px 0}.startbar{margin:4px -14px 0;padding-left:14px;padding-right:14px}
  .dock{padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px));max-height:46svh;overflow-y:auto;overscroll-behavior:contain}

  .t-kit{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}.t-kslot{--z:.5}.t-agents .t-kslot{--z:.6}.t-adice{min-height:70px}.t-dph{width:58px;height:70px}.t-agnote{white-space:normal;width:96px;flex:none}.t-agents{padding:12px 8px 14px}

}

}

function numbersFor(id, n) {
  const MAIN = { mailer: 2, spray: 4, imp: 1, druid: 3, wyrmling: 5, mimic: 6, wyrm: 3 };
  let h = 0; for (const ch of id) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  // Main twice, the one below, the one above, then main again: 2 dice 2 2, 3 dice 1 2 2, 4 dice 1 2 2 3, 5 dice 1 2 2 2 3. At the
  // edges both neighbours are the inside one (main 1: 1 2 2 1 1).
  const m = MAIN[id] || 1 + h % 6, lo = m > 1 ? m - 1 : m + 1, hi = m < 6 ? m + 1 : m - 1, pat = [m, m, lo, hi, m];
  return Array.from({ length: n }, (_, i) => pat[i % 5]);
}

<script>// Shared card markup for the chapter dice prototype. The paper build (paper/build.js) prints these cards and the
// web build (web/build.js) puts the very same markup on the table, so a card reads identically in both.
// Works in Node (require) and in the browser (inlined by web/build.js with a data object as D and the scenes it
// needs as CD_ART). The cards wear the real game's Ink & Static look (deck/cards.js): paper ground, a cut-corner frame
// in the card's accent, a solid tab, and the art set in as a dark screen of fixed height per card type.
// Throwaway prototype code: nothing outside prototypes/ may import this.
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory(require('../../data/cards.json'), require('./sim').numbersFor, require('../../data/art.json'), require('../../data/art-print.json'));
  else root.CDCards = factory(root.CD_DATA, root.CD_NUMBERS, root.CD_ART || {}, root.CD_ART || {});
})(typeof self !== 'undefined' ? self : this, function (D, numbersFor, ART, PRINT) {
  const C = { bg: '#F6F2EC', ink: '#1A1418', mut: '#5A4B43', rule: '#D8CEC3', cy: '#005F73', fl: '#FF5A2A', ex: '#A8360F', E: '#A8360F', am: '#8A4510' };
  // Ink & Static scenes, as the real game picks them: a mob by its id, the boss by its print scene (art-print.json
  // boss_<id>) else its art.json scene, an analyst by class id, an agent by kit_<type>. Print scenes mark their
  // ids with {{SID}}; one fixed suffix keeps the markup identical on paper and web (card parity).
  const SCENE = {
    mob: id => ART[id] || '', boss: id => String(PRINT['boss_' + id] || ART[id] || '').replace(/\{\{SID\}\}/g, 'cd'),
    analyst: id => ART[id] || '', agent: t => ART['kit_' + t] || '', sit: id => ART['sit_' + id] || '',
  };
  // The art.json / art-print.json keys the cards use, so web/build.js inlines only those.
  const artKeys = () => ({ art: [...MOB_IDS, ...ANALYST_IDS, ...AGENT_IDS.map(t => 'kit_' + t), ...SIT_IDS.map(id => 'sit_' + id), BOSS_ID], print: ['boss_' + BOSS_ID] });
  const art = svg => `<div class="art">${svg}</div>`;
  const tab = '<i class="tab"></i>';
  const hd = (tg, hud) => `<div class="hd"><span class="tg">${tg}</span>${hud ? `<span class="hud">${hud}</span>` : ''}</div>`;
  // Exact numbers (2026-10-30). Every die is a standard pip d6 and reads as its number. A mob card prints the dice to
  // set under it; a rolled die takes out a die showing exactly its number. Which numbers are doubles depends on the
  // analyst; every other die (the solo crew die, the Triage agent die) doubles only on a 6.
  // Same numbers as sim.js DOUBLES (web/spec.js checks they agree).
  const DOUBLES = { HUN: [1, 2, 6], RES: [3, 4, 6], ENG: [2, 4, 6], SOA: [1, 6], PAT: [3, 6], CREW: [6], AGENT: [6] };
  const isDouble = (id, n) => (DOUBLES[id] || DOUBLES.CREW).includes(n);
  // The persistence row on 2d6: a row mob comes back if the sum is at most its number. The data's d20 ranges map by
  // tier (top 12+ → 5, 10–11 → 4, 8–9 → 3, 7 or less → 2): every beaten mob goes back to the row, so the odds sit
  // three lower than they did when a comeback was gone for good. Same as sim.js rowTop (ROWSHIFT 3).
  const rowTop = N => N >= 12 ? 5 : N >= 10 ? 4 : N >= 8 ? 3 : 2;
  const cls = id => D.classes.find(c => c.id === id);
  // The dice printed on a mob or boss card: the base dice (sim.js numbersFor, clustered round the mob's main number,
  // printed low to high so they're quick to set out) and the + die a crew adds per player past three: always a 6.
  // Base = one fewer than the mob's d20 hits; the boss two fewer than its two-player hits (same as sim.js).
  // Solo and 3 players play the base dice.
  const PAST = 3;
  const diceFor = (m, boss) => {
    const base = boss ? m.hitsBase + D.bossAdd[2] - 2 : m.hits - 1;
    return { base: numbersFor(m.id, base).slice().sort((a, b) => a - b), extra: 6 };
  };
  // The dice a crew of n sets under the card: the base dice, then the + die once per player past three.
  const slotsFor = (m, boss, n) => { const d = diceFor(m, boss); return [...d.base, ...Array(Math.max(0, n - PAST)).fill(d.extra)]; };
  // A real die face: rounded square with pips. Positions on a 16-unit face.
  const PIPS = { 1: [[8, 8]], 2: [[4.6, 4.6], [11.4, 11.4]], 3: [[4.6, 4.6], [8, 8], [11.4, 11.4]], 4: [[4.6, 4.6], [11.4, 4.6], [4.6, 11.4], [11.4, 11.4]],
    5: [[4.6, 4.6], [11.4, 4.6], [8, 8], [4.6, 11.4], [11.4, 11.4]], 6: [[4.6, 4.2], [11.4, 4.2], [4.6, 8], [11.4, 8], [4.6, 11.8], [11.4, 11.8]] };
  const pip = (n, px) => `<svg class="pip" viewBox="0 0 16 16" width="${px}" height="${px}" style="display:inline-block;vertical-align:middle" role="img" aria-label="${n}"><rect x=".7" y=".7" width="14.6" height="14.6" rx="3.2" fill="#fff" stroke="${C.ink}" stroke-width="1.1"/>${PIPS[n].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="1.45" fill="${C.ink}"/>`).join('')}</svg>`;

  // ---- Cards (2.5 × 3.5 in) ----------------------------------------------------------------------------------
  const kw = { beacon: 'Beacon', noblock: 'Piercing', onpoint: 'Targeted', hardened: 'Evasive', regen: 'Regen', ramp: 'Escalating' };
  const kwText = { beacon: 'Roll the row when it arrives or comes back.', noblock: 'Blocks don’t stop it.', onpoint: 'Only on point takes its damage, doubled.', hardened: 'Only a double can hit it.', regen: 'At the end of each round, put back one die it lost.', ramp: '+1 Damage every round it stays up.' };

  function mobCard(m) {
    return `<div class="card mob">${tab}${art(SCENE.mob(m.id))}${hd(m.domain, `back on 2–${rowTop(m.persist[1])}`)}${nmRow(m.name, m.dmg)}
  <div class="kw">${kwIcon(m)}<span><b>${kw[m.ability]}.</b> ${kwText[m.ability]}</span></div><div class="fl">${m.flavor}</div>
  ${strip(diceFor(m), 24)}</div>`;
  }
  function bossCard(b) {
    return `<div class="card boss">${tab}${art(SCENE.boss(b.id))}${hd('Boss', 'arrives at 05:59')}${nmRow(b.name, b.dmg)}
  <div class="kw"><span><b>${b.abilityName}.</b> +2 Damage until it has lost two dice. Agent dice can’t hit it.</span></div>

  const PERK = {
    HUN: 'Your 1s match any number on a mob that has come back from the row.',
    RES: 'Your doubles sit in the middle: 3 and 4, plus the 6 everyone has.',
    ENG: 'Once a fight, turn one of your dice to its opposite side (1↔6, 2↔5, 3↔4). That die can’t guard.',
    SOA: `The tray holds one more agent (${D.sharedKit + 1}). Every won fight draws one more agent card.`,
    PAT: `After every fight, heal ${D.perks.PAT.fight} HP split across the crew. Recovery Agents heal ${D.perks.PAT.recover} more.`,
  };
  const analystCard = id => `<div class="card analyst cy">${tab}${art(SCENE.analyst(id))}${hd('Analyst', 'standard d6')}<div class="nm">${cls(id).name}</div>
  <div class="small">Your doubles</div><div class="dbls">${DOUBLES[id].map(n => `<div class="dface">${pip(n, 26)}</div>`).join('')}</div>
  <div class="note">A double counts as two dice showing its number, or guards.</div><div class="perk">${PERK[id]}</div></div>`;
  const AGENT = {
    triage: ['Triage Agent', 'Rolls an agent die every round.', 'On point rolls 3 more crew dice this round.'],
    enrich: ['Enrichment Agent', 'Once a round, turn one crew die to any number.', 'Every die matches anything this round.'],
    contain: ['Containment Agent', `The highest-Damage mob deals ${D.containCut} less, never below 1.`, 'Remove one die from every mob (the boss keeps at least one).'],

  const agentCard = t => `<div class="card agent cy">${tab}${art(SCENE.agent(t))}${hd('Agent', 'AI agent')}<div class="nm">${AGENT[t][0]}</div>

  const legend = `<div class="card ref am">${tab}${hd('Reference', 'every die')}<div class="nm">Dice</div>
  <div class="ex">${pip(4, 24)}<span>takes out a</span>${pip(4, 24)}<span>exactly</span></div>

  const sitCard = id => { const s = SIT[id], d = sitData(id);
    return `<div class="card sit am">${tab}${art(SCENE.sit(id))}${hd(s.kind, 'situation')}<div class="nm">${d.name}</div><div class="fl">${d.text}</div>
  ${s.rule ? `<div class="srule">${s.rule}</div>` : ''}${(s.opts || []).map(([l, r]) => `<div class="opt"><b>${l}</b>${r}</div>`).join('')}</div>`; };
  // Conditions: a card a player keeps in front of them. One of each; a player can't hold two of the same.
  const COND_IDS = ['rattled', 'exposed', 'focused'];
  const COND = {
    rattled: ['Rattled', 'Your next roll has no doubles. Then discard this.'],
    exposed: ['Exposed', 'Your next fight: each round anything hits you, take 1 more. Discard this after the fight.'],
    focused: ['Focused', 'Once, after you roll, turn one of your dice to any number. Then discard this.'],

  const condCard = id => `<div class="card cond ${id === 'focused' ? 'cy' : ''}">${tab}${hd('Condition', id === 'focused' ? 'keep it' : 'bad')}<div class="nm">${COND[id][0]}</div><div class="ctext">${COND[id][1]}</div></div>`;

  // The prototype's card set: six mobs, the Lockjaw Syndicate, five analysts, four agent types (two each).

.card::before,.card::after{content:"";position:absolute;z-index:-1;pointer-events:none}
.card::before{inset:5px;background:var(--pl);clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px))}
.card::after{inset:6.5px;background:${C.bg};clip-path:polygon(0 0,calc(100% - 15.4px) 0,100% 15.4px,100% 100%,15.4px 100%,0 calc(100% - 15.4px))}
.card.cy{--pl:${C.cy};--pa:#38E1FF}.card.am{--pl:${C.am};--pa:#FF9B54}
.card>.tab{position:absolute;left:5px;top:5px;width:30px;height:4px;background:var(--pa)}
.card .art{position:relative;flex:none;aspect-ratio:auto;height:92px;margin:0 -1px;overflow:hidden;background:#07060A;color:#F3E9E2;border:3px solid #07060A;outline:1px solid ${C.rule}}

.hd{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-top:1px}
.tg{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:10px;line-height:13px;letter-spacing:.04em;text-transform:uppercase;color:${C.ink};background:var(--pa);padding:0 5px;white-space:nowrap}

.nr{display:flex;align-items:center;gap:8px}.nr .nm{flex:1;min-width:0}
.nm{font-weight:700;font-size:16px;line-height:1.1;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}.card.boss .nm{color:${C.ex}}.card.agent .nm{color:${C.cy}}

.card.cond{justify-content:flex-start;gap:10px;padding-top:20px}.card.cond .nm{font-size:22px}.card.cond.cy .nm{color:${C.cy}}.card:not(.cy).cond .nm{color:${C.ex}}.ctext{font-size:14px;line-height:1.35;font-weight:600}
.mode{font-size:12px;line-height:1.35;border-top:1px solid ${C.rule};padding-top:4px}.mode b{display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:${C.cy}}.mode:last-child b{color:${C.am}}.small{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}`;

  return { SIT_IDS, SIT, sitCard, COND_IDS, COND, condCard, C, PAST, DOUBLES, isDouble, rowTop, pip, cls, diceFor, slotsFor, kw, kwText, strip, mobCard, bossCard, PERK, analystCard, AGENT, agentCard, legend,
    MOB_IDS, BOSS_ID, ANALYST_IDS, AGENT_IDS, mobs, boss, CARD_CSS, SCENE, artKeys };
});

<script>// Chapter dice web prototype: the rules engine. DOM-free and deterministic given a seeded rng (opt.rnd or opt.seed).
// Plays exactly the paper rules sheet (../paper/build.js): the human assigns dice, the engine checks and resolves.
// Exact numbers (2026-10-30): every die is a standard pip d6, { n: 1–6, dbl }. A mob's hits are the threat dice set
// under its card (../cards.js slotsFor); a rolled die takes out one showing exactly its number. A double counts as two
// dice showing its number (d.takes holds up to two takes, on one mob or two), or guards. Once a round each player may
// reroll one of their own dice. Beaten mobs always go back to the row. Situations (2026-10-30): one flips before every
// flip after the first, and can leave conditions (Rattled, Exposed, Focused) on a player. The Hunter's 1s are wild on
// a mob that came back; the Engineer turns a die to its opposite side once a fight. Same rules as ../sim.js
// situation(), choose() and incoming(). Throwaway prototype code.
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory(require('../../../data/cards.json'), require('../cards'));
  else root.CDEngine = factory(root.CD_DATA, root.CDCards);
})(typeof self !== 'undefined' ? self : this, function (D, CARDS) {
  const HP = 21; // starting HP (2026-10-30): situations, the Hunter's wild 1s and the Engineer's opposite-side turn; ~50% at two players in the sim
  // A rolled pip die. who: the analyst's id (their doubles), or 'CREW' / 'AGENT' (only a 6 is a double).
  const pipDie = (n, who) => ({ n, dbl: CARDS.isDouble(who, n) });
  // A crew die's double after it changes number: its owner's doubles (the solo crew die: a 6), none if rolled Rattled.
  const dieDbl = (G, d, n) => !d.rattled && CARDS.isDouble(d.src === 'crew' ? 'CREW' : G.team[d.k], n);
  const KIT_NAME = { triage: 'Triage Agent', enrich: 'Enrichment Agent', contain: 'Containment Agent', recover: 'Recovery Agent' };

  function rng(seed) { let a = seed | 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const shuffle = (a, r) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const clone = x => JSON.parse(JSON.stringify(x));
  const nameOf = id => D.classes.find(c => c.id === id).name;

  // ---- Setup ------------------------------------------------------------------------------------------------
  function newGame(opt = {}) {
    const team = opt.team || ['HUN', 'RES'], n = team.length;
    if (n < 1 || n > 4) throw new Error('1–4 players');
    const r = opt.rnd || rng(opt.seed == null ? 1 : opt.seed);
    let uid = 0;
    // slots: the threat dice under the card for this crew (base dice, then the + die once per player past two).
    const mk = (m, boss) => { const d = CARDS.diceFor(m, boss), slots = CARDS.slotsFor(m, boss, n);
      return { uid: boss ? 'boss' : 'm' + (++uid), id: m.id, name: m.name, boss, dmg: m.dmg, kw: boss ? 'wyrm' : m.ability, persist: boss ? null : m.persist.slice(),
        domain: boss ? null : m.domain, top: boss ? null : CARDS.rowTop(m.persist[1]), printed: d.base.length, extra: d.extra, hits: slots.length, slots,
        off: Array(slots.length).fill(false), offStack: [], back: 0, up: 0 }; };
    const hp = opt.hp || HP;
    const G = { n, team: team.slice(), hp: team.map(() => hp), max: hp, r,
      feed: shuffle(CARDS.mobs().map(m => mk(m, false)), r), boss: mk(CARDS.boss(), true), bossOut: false, row: [], play: [], gone: [],
      kit: shuffle(CARDS.AGENT_IDS.flatMap(t => [t, t]).map((t, i) => ({ uid: 'k' + (i + 1), t })), r), discard: [], tray: [],
      cap: D.sharedKit + (team.includes('SOA') ? D.perks.SOA.slot : 0),
      sits: shuffle(CARDS.SIT_IDS, r), sit: null, sitDone: false, pending: [], mute: 0, bonusDraw: 0, engUsed: false,
      cond: team.map(() => ({ rattled: false, exposed: false, focused: false })),
      point: 0, phase: 'flip', fight: 0, round: 0, dice: [], blocks: team.map(() => false), enrichLeft: 0, wildAll: false, roundDmg: {}, undo: [],
      over: false, win: false, log: [], rows: [], lastRow: null, drawn: [], beaten: [],
      stats: { rounds: 0, back: 0, flips: 0, guards: 0, burns: {}, gone: 0, healed: 0, sits: 0 } };
    draw(G, n === 1 ? D.quickStartSolo : D.quickStartAgent, true);
    say(G, `Shift starts: ${team.map(nameOf).join(' + ')} at ${hp} HP. Kit tray: ${G.tray.map(c => KIT_NAME[c.t]).join(', ') || 'empty'}.`);
    return G;
  }
  const say = (G, text, kind = 'info') => { G.log.push({ text, kind, fight: G.fight, round: G.round }); };

  // ---- Helpers ----------------------------------------------------------------------------------------------
  const left = m => m.off.filter(x => !x).length;
  const remaining = m => m.slots.filter((s, i) => !m.off[i]);
  const running = (G, t) => G.tray.filter(c => c.t === t).length;
  const on = (G, id) => G.team.includes(id);
  // Damage right now: Lockjaw +2 until it has lost two dice; Escalating +1 per round it stayed up.
  const dmgOf = (G, m) => m.boss ? m.dmg + (left(m) > m.hits - 2 ? 2 : 0) : m.dmg + (m.kw === 'ramp' ? m.up : 0);
  // The highest-Damage mob(s), judged on the Damage at the start of the round so a match can't flicker mid-assignment.
  const d6 = G => Math.floor(G.r() * 6);
  const findMob = (G, uid) => G.play.find(m => m.uid === uid);
  const fail = msg => { const e = new Error(msg); e.rule = true; throw e; };

  function hurt(G, k, n, why) {
    if (n <= 0 || G.over) return;
    G.hp[k] = Math.max(0, G.hp[k] - n); say(G, `${nameOf(G.team[k])} takes ${n} (${why}). ${G.hp[k]} HP left.`, 'hurt');
    if (!G.hp[k]) { G.over = true; G.win = false; G.phase = 'over'; say(G, `${nameOf(G.team[k])} is down. The shift is lost.`, 'end'); }
  }
  // Heal n HP one at a time onto whoever is lowest, never above the start.
  function spread(G, n, why) {
    let got = 0; for (let i = 0; i < n; i++) { const k = G.hp.indexOf(Math.min(...G.hp)); if (G.hp[k] >= G.max) break; G.hp[k]++; got++; }
    if (n > 0) say(G, `${why}: healed ${got} HP split across the crew.`, 'heal'); G.stats.healed += got; return got;
  }
  function draw(G, n, quiet) {
    const got = [];
    for (let i = 0; i < n; i++) {
      if (!G.kit.length && G.discard.length) { G.kit = shuffle(G.discard, G.r); G.discard = []; say(G, 'Kit deck empty: shuffled the discards into a new kit deck.'); }
      const c = G.kit.pop(); if (!c) break; G.tray.push(c); got.push(c);
    }
    G.drawn = got; if (!quiet && got.length) say(G, `Drew ${got.map(c => KIT_NAME[c.t]).join(' and ')}.`, 'kit');
    return got;
  }

  // ---- The persistence row ------------------------------------------------------------------------------------
  // Roll the 2 amber dice: every row mob whose number is at least the sum comes back with all its dice. With strike,
  // the two highest-Damage comebacks hit everyone on arrival. Returns the comebacks (enter() puts them in play).
  function rollRow(G, strike, why) {
    if (!G.row.length) return [];
    const pair = [1 + d6(G), 1 + d6(G)], roll = pair[0] + pair[1], back = G.row.filter(m => roll <= m.top);
    G.row = G.row.filter(m => !back.includes(m));
    back.forEach(m => { m.off = Array(m.hits).fill(false); m.offStack = []; m.back++; m.up = 0; });
    G.stats.back += back.length;
    const strikes = strike ? back.slice().sort((a, b) => dmgOf(G, b) - dmgOf(G, a)).slice(0, 2) : [];
    const rec = { roll, pair, why, back: back.map(m => m.name), strikes: strikes.map(m => ({ name: m.name, dmg: dmgOf(G, m) })), seq: G.rows.length + 1, fight: G.fight, round: G.round };
    G.rows.push(rec); G.lastRow = rec;

  // ---- A fight round -------------------------------------------------------------------------------------------

    G.roundDmg = {}; G.play.forEach(m => { G.roundDmg[m.uid] = dmgOf(G, m); });

    return `<aside class="t-side">
      <div class="panel pad"><h2 class="sech a"><span>Persistence row</span><span class="cnt"></span></h2>${rowHtml}</div>
      <div class="panel pad"><h2 class="sech"><span>Crew cards</span><span class="cnt">${esc(nm(G.team[G.point]))} on point</span></h2><div class="t-crewcards">${G.team.map((id, k) => `<div class="t-cslot${k === G.point ? ' pt' : ''}" data-card="analyst:${id}">${A.analystCard(id)}${k === G.point ? '<div class="lbl">On point</div>' : ''}</div>`).join('')}
        <div class="t-cslot" data-card="legend">${A.legend}</div></div></div>
    </aside>`;
  }
  function dieHtml(d, n) {
    const G = UI.G, owner = d.src === 'agent' ? 'Agent' : d.src === 'crew' ? 'Crew' : SHORT[G.team[d.k]] + (d.src === 'burn' ? '+' : '');
    const half = !d.used && d.takes && d.takes.length, usedTo = d.used === 'guard' ? 'Guard' : d.used ? [...new Set(d.takes.map(x => (G.play.find(m => m.uid === x.uid) || { name: '?' }).name))].join(' and ') : '';
    const label = `${E.faceText(d)}, ${E.dieOwner(G, d)}${d.used ? ', used: ' + usedTo : half ? ', one take left' : ''}${d.turned ? ', turned by Enrichment' : ''}${d.focused ? ', turned by Focused' : ''}${d.flipped ? ', turned to its opposite side: can’t guard' : ''}${d.rattled ? ', Rattled: no doubles' : ''}`;
    const t = !d.used && G.phase === 'assign' ? E.targets(G, d.i) : null, dead = t && !t.hits.length && !t.guard;
    const cls = ['t-die', d.src === 'agent' || d.src === 'crew' ? 'agent' : '', d.dbl ? 'dbl' : '', d.used ? 'used' : '', half ? 'half' : '', d.used === 'guard' ? 'grd' : '', dead ? 'dead' : ''].filter(Boolean).join(' ');
    return `<button class="${cls}" data-a="die" data-i="${d.i}" data-k="die${d.i}" aria-pressed="${UI.sel === d.i}" aria-label="Die ${d.i + 1}: ${esc(label)}" title="${esc(label)}">
      ${n <= 9 ? `<kbd aria-hidden="true">${d.i + 1}</kbd>` : ''}<span class="f">${A.pip(d.n, 40)}</span><span class="o">${d.used === 'guard' ? 'Guard' : d.used ? 'Used' : half ? '1 left' : d.dbl ? 'Double ×2' : esc(owner)}</span>${d.used === 'guard' || (t && t.guard && d.dbl) ? `<span class="gmark" aria-hidden="true">${ICON.shield}</span>` : ''}${d.turned ? '<span class="badge w">EN</span>' : d.flipped ? '<span class="badge c">OPP</span>' : d.focused ? '<span class="badge c">FO</span>' : d.rattled ? '<span class="badge r">RAT</span>' : ''}</button>`;
  }
  function vDock() {
    const G = UI.G; let hint = '', ctl = '';
    if (G.phase === 'flip' && G.sitDone) {
      hint = `<b>Situation done.</b> ${G.feed.length ? 'Flip the mob' : 'Bring on the boss'}.`;
      ctl = `<div class="acts"><span class="grow"></span><button class="btn p big" data-a="flip" data-k="flip">${G.feed.length ? 'Flip the mob' : 'Bring on the boss'} <kbd>F</kbd></button></div>`;
    } else if (G.phase === 'flip') {
      const sit = E.sitDue(G);
      hint = sit ? '<b>Pick who’s on point</b>, then flip a situation: it lands on them before the next mob.' : `<b>Pick who’s on point</b>, then ${G.feed.length ? 'flip the next mob' : 'bring on the boss'}.`;
      ctl = `<div class="acts"><span class="grow"></span><button class="btn p big" data-a="flip" data-k="flip">${sit ? 'Flip a situation' : G.feed.length ? 'Flip the next mob' : 'Bring on the boss'} <kbd>F</kbd></button></div>`;
    } else if (G.phase === 'sit') {
      hint = `<b>${esc(A.SIT[G.sit.id].kind)}.</b> ${esc(nm(G.team[G.point]))} is on point: ${A.SIT[G.sit.id].opts ? 'choose on the mat (keys 1–' + (G.sit.id === 'chatter' ? 5 : 2) + ').' : 'roll the row (key 1).'}`;
    } else if (G.phase === 'roll') {
      hint = G.round >= 1 ? '<b>New round.</b> Roll the row first, then everyone rolls.' : '<b>Fight!</b> Burn a Containment or Recovery Agent now if you want, then roll.';
      if (G.round >= 1 && !G.row.length) hint = '<b>New round.</b> The row is empty, so just roll the dice.';
      ctl = `<div class="acts"><span class="inc grow">${incText()}</span><button class="btn p big" data-a="roll" data-k="roll">${G.round >= 1 && G.row.length ? 'Roll the row, then the dice' : 'Roll the dice'} <kbd>R</kbd></button></div>`;
    } else if (G.phase === 'assign') {
      const d = UI.sel != null ? G.dice[UI.sel] : null, t = d ? E.targets(G, d.i) : null;
      if (d && !d.used && d.takes.length) hint = `<b>${esc(E.dieOwner(G, d))}: double ${d.n}, one more ${d.n} to place.</b> ${t.hits.length ? 'Tap another matching die, under this mob or another.' : `No ${d.n} left to take.`} Or pick another die.`;
      else if (!d) hint = (G.dice.some(x => !x.used) ? '<b>Tap a die</b>, then a matching die under a mob. Keys 1–9 pick dice.' : '<b>All dice placed.</b> End the round when you’re ready.') + (G.dice.some(x => E.canFocus(G, x)) ? ' Focused: pick one of your dice to turn it to any number.' : '') + (G.dice.some(x => E.canEng(G, x)) ? ' Engineer: pick one of your dice to turn it to its opposite side (once a fight).' : '');
      else if (d.used) hint = 'That die is used. <b>Undo</b> to take it back.';
      else hint = `<b>${esc(E.dieOwner(G, d))}: ${E.faceText(d)}.</b> ${t.hits.length ? (d.dbl ? `A double counts as two ${d.n}s: tap up to two matching dice, under one mob or two, <b>or Guard</b>.` : 'Tap a glowing die under a mob that shows the same number.') + (t.hits.some(h => h.near) ? ' Dashed rings are one off: your perk matches them.' : '') + (t.hits.some(h => h.wild) && !G.wildAll ? ' <b>Hunter’s 1:</b> it matches any die under a mob that came back.' : '') : `Nothing it can hit.${E.canReroll(G, d) ? ' <b>Reroll it?</b>' : ''}`}${t.focus ? ' <b>Focused:</b> turn it to any number.' : ''}${t.eng ? ` <b>Engineer:</b> turn it to its opposite side, a ${7 - d.n} (it can’t guard then).` : ''}${d.rattled ? ' Rattled: no doubles this roll.' : ''}${G.wildAll ? ' Every die matches anything this round.' : ''}${!d.crew ? ' Agent dice can’t hit the boss or guard.' : ''}`;
      const sel = d && !d.used;
      const ag = G.dice.filter(x => x.kuid).length;
      ctl = `<div class="t-dice" role="group" aria-label="Crew dice">${G.dice.filter(x => !x.kuid).map(x => dieHtml(x, G.dice.length)).join('')}${ag ? `<span class="t-agnote">+ ${ag} agent ${ag === 1 ? 'die' : 'dice'} under ${ag === 1 ? 'its card' : 'their cards'}</span>` : ''}</div>
        <div class="acts">
        ${sel && t.guard ? `<button class="btn cy grdb" data-a="guard" data-k="guard">${ICON.shield}Guard <kbd>G</kbd></button>` : ''}
        ${d && E.canReroll(G, d) ? `<button class="btn" data-a="reroll" data-k="reroll">Reroll it <kbd>X</kbd></button>` : ''}${G.rerolled ? `<span class="inc rr">Rerolls left: ${G.team.map((id, k) => G.rerolled[k] ? '' : esc(SHORT[id])).filter(Boolean).join(', ') || 'none'}</span>` : ''}
        ${sel && t.eng ? `<button class="btn cy" data-a="eng" data-k="eng" aria-label="Engineer: turn this die to its opposite side, ${7 - d.n}">Opposite side (→ ${7 - d.n}) <kbd>O</kbd></button>` : ''}
        ${sel && t.focus ? `<span class="inc">Focused: turn to…</span><span class="t-turn">${[1, 2, 3, 4, 5, 6].filter(n => n !== d.n).map(n => `<button class="btn s cy" data-a="focus" data-n="${n}" data-k="focus${n}" aria-label="Focused: turn this die to ${n}">${A.pip(n, 20)}</button>`).join('')}</span>` : ''}
        ${sel && t.enrich ? `<span class="inc">Enrichment: turn to</span><span class="t-turn">${[1, 2, 3, 4, 5, 6].filter(n => n !== d.n).map(n => `<button class="btn s" data-a="turn" data-n="${n}" data-k="turn${n}" aria-label="Turn this die to ${n}">${A.pip(n, 20)}</button>`).join('')}</span>` : ''}
        <span class="inc grow dk">${incText()}</span>
        <button class="btn" data-a="undo" data-k="undo" ${G.undo.length ? '' : 'disabled'}>Undo <kbd>U</kbd></button>
        <button class="btn p" data-a="end" data-k="end">End round <kbd>E</kbd></button></div>`;
    } else if (G.phase === 'loot') {
      hint = `<b>The tray holds ${G.cap}.</b> Discard ${G.tray.length - G.cap} agent${G.tray.length - G.cap === 1 ? '' : 's'} from the agents on the mat (new ones are ringed).`;
    }
    return `<div class="dock" role="region" aria-label="Dice tray"><div class="dockin"><p class="status" aria-live="polite">${UI.msg ? `<span class="${UI.err ? 'err' : ''}">${esc(UI.msg)}</span> ` : ''}${hint}</p>${ctl}</div></div>`;
  }
  function incText() {
    const G = UI.G, inc = E.incoming(G), tot = inc.total.reduce((a, b) => a + b, 0);
    return tot ? `At round end: ${G.team.map((id, k) => `${esc(nm(id))} <b class="num">−${inc.total[k]}</b>${inc.exposed.includes(k) ? ' (Exposed +1)' : ''}`).join(' · ')}` : '<span class="safe">Nothing hits back this round.</span>';
  }
  function vLog() {
    if (UI.drawer !== 'log') return '';
    const L = UI.G.log.slice().reverse();
    return `<aside class="logp" aria-label="Game log"><div class="lh"><h2 class="sech">Log</h2><button class="btn s" data-a="log" data-k="logx">Close <kbd>Esc</kbd></button></div><div class="log">${L.map(l => `<p class="${l.kind}"><span class="t">${l.fight ? `F${l.fight}${l.round ? '·R' + l.round : ''}` : '—'}</span>${esc(l.text)}</p>`).join('')}</div></aside>`;
  }
  function vGallery() {
    if (!UI.cards) return '';
    const all = [...A.mobs().map(m => ['mob:' + m.id, A.mobCard(m)]), ['boss', A.bossCard(A.boss())], ['legend', A.legend], ...A.ANALYST_IDS.map(id => ['analyst:' + id, A.analystCard(id)]), ...A.AGENT_IDS.map(t => ['agent:' + t, A.agentCard(t)])];
    return `<div class="t-gallery" role="dialog" aria-label="All cards"><div class="in"><div class="lh"><h2 class="sech">Every card in the prototype · the same markup as the paper PDF</h2><button class="btn s" data-a="cards" data-k="cardsx">Close <kbd>Esc</kbd></button></div>
      <div class="grid">${all.map(([k, h]) => `<div class="t-gslot" data-card="${k}">${h}</div>`).join('')}</div></div></div>`;
  }
  // The boss reveal (as ui/ui.js): the boss card scans in over the table, with the one thing worth knowing.
  function vReveal() {
    const G = UI.G; if (!UI.reveal || G.over) return '';
    return `<div class="reveal" role="dialog" aria-modal="true" aria-labelledby="rv-h"><div class="rv"><div class="rv-card" data-card="boss">${A.bossCard(A.boss())}</div>
      <div class="rv-b"><time class="clk f">05:59</time><h2 class="logo" id="rv-h">The boss is here</h2><p class="lede">${esc(G.boss.name)} arrives with one last row roll and no arrival hits. Agent dice can’t hit it; it hits for +2 until it has lost two dice. Spend your doubles.</p>
      <button class="btn p big" type="button" data-a="unreveal" data-k="unreveal">Face it</button></div></div></div>`;
  }
  // Who dropped the crew: the last mob whose hit took someone to 0, from the log.
  function killer() {
    const G = UI.G, h = G.log.slice().reverse().find(l => l.kind === 'hurt' && / 0 HP left/.test(l.text)), m = h && /\((.+?) (hits back|arrives)\)/.exec(h.text);
    return m ? m[1] : null;
  }
  function vEnd() {
    const G = UI.G; if (!G.over) return '';
    const ms = (UI.end || Date.now()) - UI.start, who = killer(), km = who && [...D.mobs].find(m => m.name === who);
    const artSvg = G.win ? ART.win : km ? ART[km.id] : (who === G.boss.name ? A.SCENE.boss(G.boss.id) : ART.hero);
    const down = G.hp.findIndex(h => h <= 0);
    const roster = G.team.map((id, k) => `<li class="${!G.win && k === down ? 'down' : ''}"><span class="art">${crop(ART[id], SQUARE(id))}</span><span><span class="nm">${esc(nm(id))}</span><br><span class="num">${G.hp[k]}/${G.max}</span> <span class="meta">HP</span></span></li>`).join('');
    return `<div class="t-end" role="dialog" aria-label="Shift over"><div class="end">
      <article class="endcard ${G.win ? 'win' : 'loss'}"><div class="ec-art"><span class="art">${slice(artSvg)}</span><span class="stamp" aria-hidden="true">${G.win ? 'Contained' : 'Flatlined'}</span></div>
        <div class="ec-bd"><p class="meta ${G.win ? 'c' : 'f'}">Chapter dice · d6 prototype · ${G.n}p · ${G.max} HP</p>
          <h2 class="logo" tabindex="-1">${G.win ? 'Shift survived' : 'Shift lost'}</h2>
          ${G.win ? `<p class="lede"><time class="clk dawn">06:00</time> You made it to dawn. ${esc(G.boss.name)} is beaten. Everybody walks out.</p>`
            : `<p class="cause"><time class="clk">${clockNow()}</time> The shift fell in ${G.bossOut ? 'the boss fight' : `fight ${G.fight}`}${who ? `: <b>${esc(who)}</b> took the ${esc(nm(G.team[down >= 0 ? down : 0]))} to 0 HP` : ''}.</p>`}
          <ul class="roster" aria-label="Crew">${roster}</ul>
          <div class="stats"><div><b>${G.fight}</b><span class="meta">Fights</span></div><div><b>${G.stats.rounds}</b><span class="meta">Rounds</span></div><div><b>${G.stats.back}</b><span class="meta">Comebacks</span></div><div><b>${G.stats.guards}</b><span class="meta">Guards</span></div></div>
          <div class="dur"><p class="meta">Shift took <b class="num">${mmss(ms)}</b> · lowest HP <b class="num">${Math.min(...G.hp)}</b></p><button class="lnk" type="button" data-a="copy" data-k="copy">${UI.copied === 'ok' ? ICON.check + 'Copied' : 'Copy result'}</button></div>
          ${UI.copied && UI.copied !== 'ok' ? `<label class="meta copyx">Copy this line<textarea class="t-line" rows="3" readonly>${esc(UI.copied)}</textarea></label>` : ''}
          <p class="sig" data-line>${esc(resultLine())}</p></div></article>
      <div class="endbar"><button class="btn p big" type="button" data-a="quit" data-k="again">New shift</button><button class="btn big" type="button" data-a="log" data-k="log2">Log</button></div>
    </div></div>`;
  }

  // ---- Render and events ------------------------------------------------------------------------------------------
  function render() {
    const k = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.k : null;
    app.innerHTML = UI.G ? `<div class="wrap game">${vTop()}<div class="t-main">${vTable()}${vSide()}</div></div>` + vDock() + vReveal() + vLog() + vGallery() + vEnd() : vSetup() + vGallery();
    document.body.classList.toggle('ingame', !!UI.G);
    if (k) focusKey(k);
  }
  function focusKey(k) { const el = app.querySelector(`[data-k="${k}"]`); if (el && !el.disabled) el.focus({ preventScroll: true }); }

  // ---- Card peek: hover a small card (tap it on a phone) to read it full size ----------------------------------
  // The peek holds the same shared card markup as print and the gallery. It lives outside #app so renders keep it.
  const peek = document.createElement('div'); peek.className = 't-peek'; peek.setAttribute('aria-hidden', 'true'); document.body.appendChild(peek);
  const cardByKey = k => k === 'boss' ? A.bossCard(A.boss()) : k === 'legend' ? A.legend : k.startsWith('mob:') ? A.mobCard(dataMob(k.slice(4)))
    : k.startsWith('analyst:') ? A.analystCard(k.slice(8)) : k.startsWith('agent:') ? A.agentCard(k.slice(6)) : k.startsWith('sit:') ? A.sitCard(k.slice(4)) : k.startsWith('cond:') ? A.condCard(k.slice(5)) : '';
  let peekKey = null, lastPtr = 'mouse';
  function showPeek(slot) {
    const c = slot && slot.querySelector('.card'); if (!c || slot.closest('.t-gallery')) return hidePeek();
    const r = c.getBoundingClientRect(); if (r.width >= 300) return hidePeek(); // already big enough to read
    const k = slot.dataset.card; if (peekKey !== k) { peek.innerHTML = cardByKey(k); peekKey = k; }
    const vw = window.innerWidth, vh = window.innerHeight, W = Math.min(360, vw - 16, (vh - 16) * 240 / 336), H = W * 336 / 240, gap = 12;
    let x = r.right + gap; if (x + W > vw - 8) x = r.left - gap - W; if (x < 8) x = (vw - W) / 2;
    const y = Math.max(8, Math.min(r.top + r.height / 2 - H / 2, vh - H - 8));
    peek.style.setProperty('--pz', (W / 240).toFixed(3)); peek.style.left = x + 'px'; peek.style.top = y + 'px'; peek.classList.add('on');
  }
  function hidePeek() { peek.classList.remove('on'); peekKey = null; }
  const peekSlot = t => t && t.closest && t.closest('.card') && !t.closest('[data-a]') ? t.closest('[data-card]') : null;
  app.addEventListener('pointerdown', e => { lastPtr = e.pointerType || 'mouse'; }, { capture: true });
  app.addEventListener('mouseover', e => { if (lastPtr === 'touch') return; const s = peekSlot(e.target); if (s) showPeek(s); else hidePeek(); });
  app.addEventListener('mouseleave', hidePeek);
  app.addEventListener('click', e => { if (lastPtr !== 'touch') return; const s = peekSlot(e.target);
    if (s && !(peek.classList.contains('on') && peekKey === s.dataset.card)) showPeek(s); else hidePeek(); });
  window.addEventListener('scroll', hidePeek, { passive: true });

  app.addEventListener('click', e => {
    const G = UI.G;
    const b = e.target.closest && e.target.closest('[data-a]'); if (!b || b.disabled) return;
    const a = b.dataset.a;
    if (a === 'pick') { const s = UI.setup.team, id = b.dataset.id, j = s.indexOf(id); if (j >= 0) { if (s.length > 1) s.splice(j, 1); } else if (s.length < 4) s.push(id); return render(); }
    if (a === 'start') return startGame();
    if (a === 'snd') { Sound.toggle(); return render(); }
    if (a === 'cards') { UI.cards = !UI.cards; return render(); }
    if (a === 'log') { UI.drawer = UI.drawer === 'log' ? null : 'log'; return render(); }
    if (a === 'quit') { if (G && !G.over && !confirmQuit()) return; UI.G = null; UI.drawer = null; UI.reveal = false; UI.seed = (UI.seed * 7 + 13) % 1e9; return render(); }
    if (a === 'copy') return copyResult();
    if (!G) return;
    if (a === 'unreveal') { UI.reveal = false; render(); return focusKey('roll'); }
    if (a === 'point') return act(() => E.setPoint(G, +b.dataset.n));
    if (a === 'flip') { act(() => E.flip(G)); if (G.phase === 'sit') { say(`Situation: ${D.situations.find(s => s.id === G.sit.id).name}. ${nm(G.team[G.point])} is on point.`); return focusKey(app.querySelector('[data-a="sit"]:not(:disabled)') ? app.querySelector('[data-a="sit"]:not(:disabled)').dataset.k : ''); } return focusKey(UI.reveal ? 'unreveal' : 'roll'); }
    if (a === 'sit') { act(() => E.resolveSit(G, b.dataset.o, b.dataset.n ? +b.dataset.n : undefined)); if (!UI.err && G.sit) say(G.sit.text); return focusKey(G.phase === 'flip' ? 'sitflip' : ''); }
    if (a === 'focus') { const i = UI.sel; act(() => E.focus(G, i, +b.dataset.n)); return focusKey('die' + i); }
    if (a === 'eng') { const i = UI.sel; act(() => E.engTurn(G, i)); return focusKey('die' + i); }
    if (a === 'roll') { UI.reveal = false; UI.sel = null; UI.more = null; act(() => E.roll(G)); nextDie(); render(); return focusKey('die' + (UI.sel || 0)); }
    if (a === 'die') { const i = +b.dataset.i; UI.more = null; UI.sel = UI.sel === i ? null : i; UI.msg = ''; return render(); }
    if (a === 'slot') return tapSlot(b.dataset.u, +b.dataset.p);
    if (a === 'guard') return doGuard();
    if (a === 'reroll') { const i = UI.sel; act(() => E.reroll(G, i)); return focusKey('die' + i); }
    if (a === 'turn') { const i = UI.sel; return act(() => E.enrichTurn(G, i, +b.dataset.n)); }
    if (a === 'undo') { UI.more = null; act(() => E.unassign(G)); const last = G.dice.filter(d => !d.used).map(d => d.i); if (UI.sel == null || (G.dice[UI.sel] && G.dice[UI.sel].used)) UI.sel = last.length ? last[last.length - 1] : null; return render(); }
    if (a === 'end') { UI.sel = null; UI.more = null; act(() => E.endRound(G)); return focusKey(G.phase === 'roll' ? 'roll' : 'flip'); }
    if (a === 'burn') { act(() => E.burn(G, b.dataset.u)); if (G.phase === 'assign' && UI.sel == null) { nextDie(); render(); } return; }
    if (a === 'discard') { act(() => E.discardKit(G, b.dataset.u)); return; }
  });
  const confirmQuit = () => { try { return window.confirm('Abandon this shift?'); } catch (e) { return true; } };
  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey || /INPUT|TEXTAREA|SELECT/.test((e.target || {}).tagName || '')) return;
    const G = UI.G, key = e.key.toLowerCase(), click = k => { const el = app.querySelector(`[data-a="${k}"]`); if (el && !el.disabled) { el.click(); e.preventDefault(); } };
    if (key === 'escape' && peek.classList.contains('on')) { hidePeek(); return; }
    if (key === 'escape') { if (UI.cards) UI.cards = false; else if (UI.drawer) UI.drawer = null; else if (UI.reveal) UI.reveal = false; else UI.sel = null; return render(); }
    if (!G) return;
    if (key === 'l') return click('log');
    if (UI.reveal && (key === 'enter' || key === ' ')) return click('unreveal');
    if (G.phase === 'flip' && key === 'f') return click('flip');
    if (G.phase === 'sit' && /^[1-9]$/.test(key)) { const el = [...app.querySelectorAll('[data-a="sit"]')][+key - 1]; if (el && !el.disabled) { el.click(); e.preventDefault(); } return; }
    if (G.phase === 'roll' && key === 'r') return click('roll');
    if (G.phase === 'assign') {
      if (/^[1-9]$/.test(key) && G.dice[+key - 1]) { UI.more = null; UI.sel = +key - 1; UI.msg = ''; render(); return focusKey('die' + UI.sel); }
      if (key === 'g') return click('guard');
      if (key === 'x') return click('reroll');
      if (key === 'o') return click('eng');
      if (key === 'u' || key === 'backspace') return click('undo');
      if (key === 'e') return click('end');
    }
  });
  window.CDUI = { UI, render, resultLine, clockAt };
  render();
})();
</script>
