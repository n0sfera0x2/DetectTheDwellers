# Publishes the d6 chapter dice playtest to GitHub Pages: the playable page (one self-contained file) and the
# print-and-play PDF, plus the music the page loads (audio/music/, 2026-11-25; the sound effects are inlined). Page and PDF are built locally and committed; this only copies them into the site.
name: Playtest site
on:
  push:
    branches: [main]
    paths:
      - game/web/index.html
      - game/paper/chapter-dice-paper.pdf
      - game/audio/music/**
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # Build and deploy are separate jobs, as in GitHub's Pages template (2026-11-25): with one job, deploy-pages kept
  # failing to find the artifact the same job had just uploaded ("No artifacts named github-pages").
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp game/web/index.html _site/index.html
          cp game/paper/chapter-dice-paper.pdf _site/detect-the-dwellers-print-and-play.pdf
          mkdir -p _site/audio/music
          cp game/audio/music/*.mp3 _site/audio/music/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
