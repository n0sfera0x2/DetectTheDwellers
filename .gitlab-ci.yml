# The pipeline fleet workers wait on before auto-merge.
stages: [test]

test:
  stage: test
  # No browser here on purpose: Linux Chromium lays out the old print deck's text wider than macOS,
  # so its two rendered overflow checks skip in CI and run on a Mac with `npm test`.
  image: node:20
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  script:
    - npm ci --cache .npm --prefer-offline
    - node --test game/web/spec.js
    - npm test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
